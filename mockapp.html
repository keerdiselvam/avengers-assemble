<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Analytics</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; 
            margin: 0;
            padding: 0;
            overscroll-behavior-y: none;
        }
        /* Custom scrollbar to keep it clean */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Safe area padding for mobile devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        /* Smooth transitions for view switching */
        .view-layer {
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen m-0 p-0 overflow-hidden">

    <div class="w-full max-w-md bg-gray-50 flex flex-col h-[100dvh] relative shadow-2xl overflow-hidden">
        
        <!-- App Header (Hidden on Login) -->
        <header id="app-header" class="hidden bg-white px-4 py-3 border-b flex items-center justify-between sticky top-0 z-20 shadow-sm shrink-0">
            <div class="font-bold text-xl text-blue-600 tracking-tight flex items-center gap-2">
                <i class="fas fa-chart-network text-blue-500"></i> Nexus
            </div>
            <div class="flex items-center space-x-3">
                <span id="current-username" class="text-sm font-medium text-gray-600">@username</span>
                <button id="logout-btn" class="p-2 text-gray-400 hover:text-red-500 transition-colors bg-gray-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto relative hide-scrollbar">
            
            <div id="view-login" class="view-layer flex flex-col items-center justify-center min-h-full p-6 bg-gradient-to-b from-blue-50 to-white">
                <div class="w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg text-2xl">
                            <i class="fas fa-users"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-900">Nexus Analytics</h1>
                        <p class="text-gray-500 text-sm mt-2">Mock Social Data Platform</p>
                    </div>
                    
                    <form id="login-form" class="space-y-4">
                        <div id="login-error" class="hidden text-red-500 text-sm text-center bg-red-50 p-2 rounded-lg"></div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username (No password required)</label>
                            <input type="text" id="login-input" placeholder="e.g. john_doe" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none" />
                        </div>
                        <button type="submit" id="login-btn" disabled
                            class="w-full bg-gray-400 text-white font-semibold py-3 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2 cursor-not-allowed">
                            <i class="fas fa-spinner fa-spin" id="login-spinner"></i>
                            <span id="login-btn-text">Connecting to Server...</span>
                        </button>
                    </form>
                </div>
            </div>

            <div id="view-feed" class="view-layer hidden p-3 sm:p-4 pb-24 space-y-4">
                <div id="feed-container" class="space-y-4">
                    <!-- Posts will be injected here dynamically -->
                    <div class="text-center py-12 text-gray-500 flex flex-col items-center">
                        <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-gray-300"></i>
                        <p>Loading posts...</p>
                    </div>
                </div>
            </div>

            <div id="view-chat" class="view-layer hidden flex flex-col h-full bg-gray-50 relative">
                <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 pb-20">
                    <!-- Messages will be injected here dynamically -->
                </div>
                
                <!-- Chat Input Fixed at bottom of chat view -->
                <div class="sticky bottom-0 w-full bg-white border-t border-gray-200 p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                    <form id="chat-form" class="flex items-center space-x-2">
                        <input type="text" id="chat-input" placeholder="Type a message to global chat..." autocomplete="off"
                            class="flex-1 bg-gray-100 px-4 py-2.5 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
                        <button type="submit" class="bg-blue-600 text-white p-2.5 rounded-full hover:bg-blue-700 transition-colors w-10 h-10 flex items-center justify-center disabled:opacity-50">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div id="view-network" class="view-layer hidden p-3 sm:p-4 pb-24 space-y-3">
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm mb-4 flex justify-between items-center">
                    <div>
                        <h2 class="font-bold text-gray-800 mb-1">Your Network</h2>
                        <p id="network-stats" class="text-sm text-gray-500">Following: 0 | Followers: 0</p>
                    </div>
                    <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center text-blue-500">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
                <div id="network-container" class="space-y-3">
                    <!-- Profiles injected here -->
                    <div class="text-center py-8 text-gray-400">Loading network directory...</div>
                </div>
            </div>

            <div id="view-post" class="view-layer hidden p-3 sm:p-4 pb-24">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-4">
                    <h2 class="text-xl font-bold text-gray-800 border-b pb-2">Create New Post</h2>
                    
                    <!-- Image Drop/Select Zone -->
                    <div id="drop-zone" class="w-full border-2 border-dashed border-gray-300 rounded-xl p-6 flex flex-col items-center justify-center bg-gray-50 relative hover:bg-gray-100 transition-colors cursor-pointer min-h-[160px]">
                        <div id="image-preview-container" class="hidden relative w-full flex justify-center">
                            <img id="image-preview" src="" alt="Preview" class="max-h-64 rounded shadow-sm object-contain" />
                            <button type="button" id="remove-image-btn" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-600 transition-colors">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div id="upload-prompt" class="flex flex-col items-center">
                            <i class="fas fa-cloud-upload-alt text-4xl text-blue-400 mb-2"></i>
                            <p class="text-sm font-medium text-gray-700">Click to upload media</p>
                            <p class="text-xs text-gray-500 mt-1">Images will be compressed automatically</p>
                        </div>
                        <input type="file" id="image-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="post-desc" placeholder="What's on your mind? (Reddit-style long text allowed)" rows="4"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hashtags (comma separated)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-hashtag text-gray-400"></i>
                            </div>
                            <input type="text" id="post-tags" placeholder="sih, mockdata, analytics"
                                class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                        </div>
                    </div>

                    <button id="submit-post-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 disabled:opacity-50 transition-colors shadow-md flex items-center justify-center gap-2">
                        <i class="fas fa-paper-plane"></i> Publish Post
                    </button>
                </div>
            </div>
        </main>

        <nav id="bottom-nav" class="hidden bg-white border-t border-gray-200 px-2 flex justify-around items-center pb-safe shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-20 shrink-0 h-[64px]">
            <button data-view="feed" class="nav-btn p-2 flex flex-col items-center space-y-1 text-gray-400 w-16 transition-colors">
                <i class="fas fa-home text-xl nav-icon"></i>
                <span class="text-[10px] font-medium">Feed</span>
            </button>
            <button data-view="network" class="nav-btn p-2 flex flex-col items-center space-y-1 text-gray-400 w-16 transition-colors">
                <i class="fas fa-users text-xl nav-icon"></i>
                <span class="text-[10px] font-medium">Network</span>
            </button>
            <div class="relative w-16 flex justify-center">
                <button data-view="post" class="nav-btn absolute -top-8 flex flex-col items-center bg-blue-600 text-white rounded-full shadow-lg hover:shadow-xl hover:bg-blue-700 transition-all w-14 h-14 justify-center ring-4 ring-gray-50">
                    <i class="fas fa-plus text-xl"></i>
                </button>
            </div>
            <button data-view="chat" class="nav-btn p-2 flex flex-col items-center space-y-1 text-gray-400 w-16 transition-colors">
                <i class="fas fa-comment-dots text-xl nav-icon"></i>
                <span class="text-[10px] font-medium">Chat</span>
            </button>
        </nav>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your specific Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCJaDrE-Ex9DxyV6Hw_-5NAQk3XY4lPTvY",
            authDomain: "avengers-assemble-b97f5.firebaseapp.com",
            projectId: "avengers-assemble-b97f5",
            storageBucket: "avengers-assemble-b97f5.firebasestorage.app",
            messagingSenderId: "1055143035893",
            appId: "1:1055143035893:web:77673867994d3941c396bc"
        };
        
        const appId = 'sih-mock-app-html';
        
        let app, auth, db;
        let currentUser = null;
        let activeProfile = null;
        let currentView = 'login';
        
        let profilesData = [];
        let postsData = [];
        let messagesData = [];
        let currentImageBase64 = null;

        let unsubProfiles, unsubPosts, unsubMessages;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            setupAuthentication();
        } catch (error) {
            showLoginError("Failed to initialize database connection.");
            console.error("Firebase Init Error:", error);
        }

        async function setupAuthentication() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    const loginBtn = document.getElementById('login-btn');
                    const loginSpinner = document.getElementById('login-spinner');
                    const loginBtnText = document.getElementById('login-btn-text');

                    if (user) {
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                        loginBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                        loginSpinner.classList.add('hidden');
                        loginBtnText.textContent = "Enter Platform";
                    } else {
                        if(activeProfile) logout();
                    }
                });
            } catch (err) {
                showLoginError("Authentication failed securely.");
                console.error("Auth Error:", err);
            }
        }

        const views = {
            login: document.getElementById('view-login'),
            feed: document.getElementById('view-feed'),
            chat: document.getElementById('view-chat'),
            network: document.getElementById('view-network'),
            post: document.getElementById('view-post')
        };
        const header = document.getElementById('app-header');
        const bottomNav = document.getElementById('bottom-nav');

        function switchView(viewName) {
            currentView = viewName;
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[viewName].classList.remove('hidden');

            if (viewName === 'login') {
                header.classList.add('hidden');
                bottomNav.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
                bottomNav.classList.remove('hidden');
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.dataset.view) {
                        if (btn.dataset.view === viewName && viewName !== 'post') {
                            btn.classList.replace('text-gray-400', 'text-blue-600');
                        } else if (viewName !== 'post') {
                            btn.classList.replace('text-blue-600', 'text-gray-400');
                        }
                    }
                });
                if (viewName === 'chat') {
                    scrollToBottom(document.getElementById('chat-container'));
                } else {
                    document.getElementById('main-content').scrollTop = 0;
                }
            }
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if(btn.dataset.view) switchView(btn.dataset.view);
            });
        });

        function showLoginError(msg) {
            const errDiv = document.getElementById('login-error');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');
        }

        function getCollectionPath(colName) {
            return collection(db, 'artifacts', appId, 'public', 'data', colName);
        }
        
        function getDocPath(colName, docId) {
            return doc(db, 'artifacts', appId, 'public', 'data', colName, docId);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('login-btn-text');
            const spinner = document.getElementById('login-spinner');
            const errDiv = document.getElementById('login-error');
            const input = document.getElementById('login-input').value.trim();
            
            const cleanId = input.toLowerCase().replace(/[^a-z0-9_]/g, ''); 
            
            if (!currentUser) {
                showLoginError("Still connecting to secure server. Please wait.");
                return;
            }

            if (!cleanId) {
                showLoginError("Please enter a valid username.");
                return;
            }
            
            errDiv.classList.add('hidden');
            btn.disabled = true;
            btnText.textContent = 'Authenticating...';
            spinner.classList.remove('hidden');

            try {
                const profileRef = getDocPath('profiles', cleanId);
                const snap = await getDoc(profileRef);
                
                if (snap.exists()) {
                    activeProfile = { id: snap.id, ...snap.data() };
                } else {
                    activeProfile = {
                        id: cleanId,
                        username: input,
                        following: [],
                        followers: [],
                        joinedAt: Date.now()
                    };
                    await setDoc(profileRef, activeProfile);
                }
                
                document.getElementById('current-username').textContent = `@${activeProfile.username}`;
                setupSubscriptions();
                switchView('feed');
                document.getElementById('login-input').value = '';
            } catch (err) {
                console.error("Login Error:", err);
                showLoginError("Network error. Please try again.");
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Enter Platform';
                spinner.classList.add('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', logout);
        
        function logout() {
            activeProfile = null;
            if(unsubProfiles) unsubProfiles();
            if(unsubPosts) unsubPosts();
            if(unsubMessages) unsubMessages();
            switchView('login');
        }

        function setupSubscriptions() {
            if (!db || !activeProfile || !currentUser) return;

            unsubProfiles = onSnapshot(getCollectionPath('profiles'), (snap) => {
                profilesData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const syncedMe = profilesData.find(p => p.id === activeProfile.id);
                if (syncedMe) activeProfile = syncedMe;
                renderNetwork();
            }, (err) => console.error("Profiles error:", err));

            unsubPosts = onSnapshot(getCollectionPath('posts'), (snap) => {
                postsData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                postsData.sort((a, b) => b.createdAt - a.createdAt);
                renderFeed();
            }, (err) => console.error("Posts error:", err));

            unsubMessages = onSnapshot(getCollectionPath('messages'), (snap) => {
                messagesData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                messagesData.sort((a, b) => a.createdAt - b.createdAt);
                renderChat();
            }, (err) => console.error("Messages error:", err));
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            if (postsData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-gray-500 flex flex-col items-center bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                        <i class="fas fa-camera text-5xl mb-4 text-blue-200"></i>
                        <p class="font-medium">Your feed is empty.</p>
                        <p class="text-sm mt-1">Be the first to share a post!</p>
                        <button onclick="document.querySelector('[data-view=\\'post\\']').click()" class="mt-4 bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-medium text-sm hover:bg-blue-100 transition-colors">Create Post</button>
                    </div>`;
                return;
            }

            container.innerHTML = postsData.map(post => {
                const initial = (post.authorName || '?').charAt(0).toUpperCase();
                const postDate = new Date(post.createdAt);
                const timeStr = isNaN(postDate.getTime()) ? 'Unknown date' : postDate.toLocaleString([], {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                
                const imgHtml = post.imageBase64 ? `
                    <div class="mb-3 rounded-lg overflow-hidden border border-gray-100 bg-black flex justify-center mt-3">
                        <img src="${post.imageBase64}" alt="Post media" class="w-full max-h-[400px] object-contain" loading="lazy" />
                    </div>` : '';
                
                const tagsHtml = (post.hashtags && post.hashtags.length > 0) ? `
                    <div class="flex flex-wrap gap-2 mt-2">
                        ${post.hashtags.map(tag => `<span class="text-blue-600 text-sm font-medium hover:underline cursor-pointer bg-blue-50 px-2 py-0.5 rounded-md">#${tag.trim()}</span>`).join('')}
                    </div>` : '';

                return `
                    <div class="bg-white p-4 sm:p-5 border-b sm:border sm:rounded-xl shadow-sm border-gray-100 mb-4">
                        <div class="flex items-center space-x-3 mb-2">
                            <div class="w-10 h-10 bg-gradient-to-tr from-blue-500 to-purple-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-inner shrink-0">
                                ${initial}
                            </div>
                            <div>
                                <div class="font-bold text-gray-900 leading-tight">${post.authorName}</div>
                                <div class="text-xs text-gray-500 mt-0.5">${timeStr}</div>
                            </div>
                        </div>
                        <p class="text-gray-800 whitespace-pre-wrap text-[15px] leading-relaxed mt-3">${post.description}</p>
                        ${tagsHtml}
                        ${imgHtml}
                        <div class="flex items-center justify-between border-t border-gray-100 pt-3 mt-4 text-gray-500 px-2">
                            <button class="flex items-center space-x-2 hover:text-red-500 transition-colors group">
                                <div class="p-2 rounded-full group-hover:bg-red-50 transition-colors">
                                    <i class="far fa-heart text-xl"></i> 
                                </div>
                                <span class="text-sm font-medium">${post.likes || 0}</span>
                            </button>
                            <button class="flex items-center space-x-2 hover:text-blue-500 transition-colors group">
                                <div class="p-2 rounded-full group-hover:bg-blue-50 transition-colors">
                                    <i class="far fa-comment text-xl"></i>
                                </div>
                                <span class="text-sm font-medium">0</span>
                            </button>
                            <button class="flex items-center space-x-2 hover:text-green-500 transition-colors group">
                                <div class="p-2 rounded-full group-hover:bg-green-50 transition-colors">
                                    <i class="fas fa-share-nodes text-xl"></i>
                                </div>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            if (messagesData.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-60">
                        <i class="fas fa-comments text-5xl mb-3"></i>
                        <p>Welcome to Global Chat!</p>
                        <p class="text-xs mt-1">Say hi to the community.</p>
                    </div>`;
                return;
            }

            container.innerHTML = messagesData.map(msg => {
                const isMe = msg.authorId === activeProfile.id;
                const dateObj = new Date(msg.createdAt);
                const timeStr = isNaN(dateObj.getTime()) ? '' : dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const alignClass = isMe ? 'justify-end pl-12' : 'justify-start pr-12';
                const bgClass = isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-gray-100 text-gray-800 rounded-bl-none shadow-sm';
                const nameHtml = !isMe ? `<div class="text-[11px] font-bold text-blue-600 mb-1 leading-none tracking-wide">${msg.authorName}</div>` : '';
                const timeColor = isMe ? 'text-blue-200' : 'text-gray-400';

                return `
                    <div class="flex ${alignClass} w-full">
                        <div class="rounded-2xl px-4 py-2.5 ${bgClass} max-w-full break-words">
                            ${nameHtml}
                            <div class="text-[15px] leading-snug">${msg.text}</div>
                            <div class="text-[10px] mt-1 text-right ${timeColor}">${timeStr}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            if(currentView === 'chat') scrollToBottom(container);
        }

        function renderNetwork() {
            const container = document.getElementById('network-container');
            const stats = document.getElementById('network-stats');
            
            const followingCount = (activeProfile.following || []).length;
            const followersCount = profilesData.filter(p => (p.following || []).includes(activeProfile.id)).length; 
            
            stats.textContent = `Following: ${followingCount} | Followers: ${followersCount}`;

            const others = profilesData.filter(p => p.id !== activeProfile.id);
            if (others.length === 0) {
                 container.innerHTML = `<div class="text-center py-8 text-gray-400">You are the first user here!</div>`;
                 return;
            }

            container.innerHTML = others.map(profile => {
                const isFollowing = (activeProfile.following || []).includes(profile.id);
                const initial = (profile.username || '?').charAt(0).toUpperCase();
                
                const joinedDate = new Date(profile.joinedAt);
                const joined = isNaN(joinedDate.getTime()) ? 'Unknown' : joinedDate.toLocaleDateString();
                
                const btnClass = isFollowing 
                    ? 'bg-gray-100 text-gray-700 hover:bg-gray-200 border-gray-200' 
                    : 'bg-blue-50 text-blue-700 hover:bg-blue-100 border-blue-100';
                const btnIcon = isFollowing ? '<i class="fas fa-check"></i>' : '<i class="fas fa-plus"></i>';
                const btnText = isFollowing ? 'Following' : 'Follow';

                return `
                    <div class="flex items-center justify-between bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-100 transition-all hover:shadow-md">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-lg shrink-0">
                                ${initial}
                            </div>
                            <div class="truncate">
                                <div class="font-bold text-gray-900 truncate">${profile.username}</div>
                                <div class="text-xs text-gray-500">Joined ${joined}</div>
                            </div>
                        </div>
                        <button onclick="toggleFollow('${profile.id}')"
                            class="shrink-0 px-4 py-1.5 rounded-full text-sm font-semibold flex items-center space-x-1.5 border transition-all ${btnClass}">
                            ${btnIcon} <span>${btnText}</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        window.toggleFollow = async function(targetId) {
            if (!activeProfile || !currentUser) return;
            const isFollowing = (activeProfile.following || []).includes(targetId);
            const newFollowing = isFollowing 
                ? activeProfile.following.filter(id => id !== targetId)
                : [...(activeProfile.following || []), targetId];

            try {
                activeProfile.following = newFollowing; 
                renderNetwork();
                await updateDoc(getDocPath('profiles', activeProfile.id), { following: newFollowing });
            } catch (err) { 
                console.error("Follow error:", err); 
            }
        };

        function scrollToBottom(el) {
            setTimeout(() => {
                el.scrollTop = el.scrollHeight;
            }, 50);
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeProfile || !currentUser) return;
            
            const btn = e.target.querySelector('button');
            btn.disabled = true;

            try {
                await addDoc(getCollectionPath('messages'), {
                    authorId: activeProfile.id,
                    authorName: activeProfile.username,
                    text: text,
                    createdAt: Date.now()
                });
                input.value = '';
                scrollToBottom(document.getElementById('chat-container'));
            } catch (err) { 
                console.error("Send message error:", err); 
            } finally {
                btn.disabled = false;
                input.focus(); 
            }
        });

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_DIM = 700;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_DIM) {
                                height *= MAX_DIM / width;
                                width = MAX_DIM;
                            }
                        } else {
                            if (height > MAX_DIM) {
                                width *= MAX_DIM / height;
                                height = MAX_DIM;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
            });
        };

        const imageInput = document.getElementById('image-input');
        const imgPreview = document.getElementById('image-preview');
        const imgContainer = document.getElementById('image-preview-container');
        const uploadPrompt = document.getElementById('upload-prompt');
        const removeImgBtn = document.getElementById('remove-image-btn');

        async function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            
            uploadPrompt.innerHTML = `<i class="fas fa-spinner fa-spin text-3xl text-blue-400 mb-2"></i><p class="text-sm font-medium">Processing...</p>`;
            
            currentImageBase64 = await compressImage(file);
            imgPreview.src = currentImageBase64;
            
            imgContainer.classList.remove('hidden');
            uploadPrompt.classList.add('hidden');
            imageInput.classList.add('hidden');
            
            uploadPrompt.innerHTML = `<i class="fas fa-cloud-upload-alt text-4xl text-blue-400 mb-2"></i><p class="text-sm font-medium text-gray-700">Click to upload media</p><p class="text-xs text-gray-500 mt-1">Images will be compressed automatically</p>`;
        }

        imageInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        
        removeImgBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            currentImageBase64 = null;
            imgPreview.src = '';
            imgContainer.classList.add('hidden');
            uploadPrompt.classList.remove('hidden');
            imageInput.classList.remove('hidden');
            imageInput.value = ''; 
        });

        document.getElementById('submit-post-btn').addEventListener('click', async () => {
            const desc = document.getElementById('post-desc').value;
            const tags = document.getElementById('post-tags').value;
            const btn = document.getElementById('submit-post-btn');

            if ((!desc.trim() && !currentImageBase64) || !activeProfile || !currentUser) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Publishing...`;

            const hashtagArray = tags.split(',')
                .map(t => t.trim().replace(/^#/, '')) 
                .filter(t => t.length > 0 && /^[a-zA-Z0-9_]+$/.test(t)); 

            try {
                await addDoc(getCollectionPath('posts'), {
                    authorId: activeProfile.id,
                    authorName: activeProfile.username,
                    description: desc.trim(),
                    hashtags: hashtagArray,
                    imageBase64: currentImageBase64,
                    likes: 0,
                    createdAt: Date.now()
                });
                
                document.getElementById('post-desc').value = '';
                document.getElementById('post-tags').value = '';
                removeImgBtn.click();
                
                switchView('feed');
            } catch (err) {
                console.error("Posting error:", err);
                alert("Failed to publish post. Document may be too large.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> Publish Post`;
            }
        });
    </script>
</body>
</html>
