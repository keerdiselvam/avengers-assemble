<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karuthu — Social Space</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{--accent:#7d2f3a;--accent2:#167c80;--cyan:#2d9c9f;--ink:#25201d;--muted:#756b65;--glass:#fffdf9;--line:rgba(74,52,43,.14);--panel:#f7f1e9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Times New Roman",Times,serif;color:var(--ink);background:#eee6db;font-size:17px;line-height:1.45}
body{overscroll-behavior-y:none;overflow:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-4;background:radial-gradient(circle at 12% 12%,rgba(125,47,58,.13),transparent 23%),radial-gradient(circle at 88% 20%,rgba(22,124,128,.12),transparent 25%),linear-gradient(135deg,#f4eee6,#e8ded1 55%,#f6f0e8);animation:ambientKaruthu 32s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,rgba(255,255,255,.32),transparent 35%);pointer-events:none}
.water-layer{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.water-drop{position:absolute;width:170px;height:170px;border-radius:48% 52% 58% 42%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.68),rgba(62,161,163,.18) 34%,rgba(22,124,128,.08) 62%,transparent 73%);filter:blur(.5px);box-shadow:inset -18px -20px 40px rgba(255,255,255,.2),0 30px 90px rgba(22,124,128,.10);animation:waterFloatKaruthu 22s cubic-bezier(.45,.05,.55,.95) infinite}
.water-drop:nth-child(1){left:-40px;top:18%;animation-delay:-6s}.water-drop:nth-child(2){right:-55px;top:48%;width:220px;height:220px;animation-delay:-13s}.water-drop:nth-child(3){left:35%;bottom:-80px;width:240px;height:240px;animation-delay:-18s}
@keyframes ambientKaruthu{to{transform:translate3d(2%,1.5%,0) scale(1.035)}}
@keyframes waterFloatKaruthu{0%,100%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}50%{transform:translate3d(22px,-34px,0) scale(1.045) rotate(4deg)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(74,52,43,.18);border-radius:99px}
button,input,textarea,select{font:inherit;font-size:1rem}button{transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s,background .3s;cursor:pointer}button:active{transform:scale(.96)}
.glass{background:rgba(255,253,249,.88);border:1px solid rgba(74,52,43,.12);box-shadow:0 18px 55px rgba(69,48,37,.10),inset 0 1px rgba(255,255,255,.8);backdrop-filter:blur(18px) saturate(110%)}
.glass-soft{background:rgba(255,255,255,.56);border:1px solid rgba(74,52,43,.11);backdrop-filter:blur(12px)}
.card{border-radius:22px}.pill{border-radius:999px}.gradient-text{background:linear-gradient(110deg,#7d2f3a,#167c80);-webkit-background-clip:text;background-clip:text;color:transparent}
.app-shell{width:100%;min-height:100dvh;position:relative;background:transparent}
.main-scroll{height:100dvh;overflow-y:auto;scroll-behavior:smooth;padding-bottom:140px}
.view{animation:viewInKaruthu .8s cubic-bezier(.16,1,.3,1);padding-bottom:150px}
@keyframes viewInKaruthu{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.avatar{object-fit:cover;border-radius:50%;background:linear-gradient(135deg,#7d2f3a,#2d9c9f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.icon-btn{width:39px;height:39px;border:1px solid rgba(74,52,43,.12);background:rgba(255,255,255,.7);border-radius:14px;color:#514740;display:grid;place-items:center}
.field{width:100%;border:1px solid rgba(74,52,43,.14);background:rgba(255,255,255,.72);color:#2a2522;border-radius:14px;padding:14px 16px;outline:none;transition:.3s}
.field:focus{border-color:rgba(22,124,128,.55);box-shadow:0 0 0 4px rgba(22,124,128,.08);background:#fff}
.primary{background:linear-gradient(135deg,#7d2f3a,#167c80);color:white;border:0;box-shadow:0 12px 28px rgba(22,124,128,.20);font-weight:700}
.secondary{background:rgba(255,255,255,.7);border:1px solid rgba(74,52,43,.13);color:#4e453f;font-weight:600}
.danger-outline{background:#fff;border:1px solid rgba(166,61,61,.3);color:#a63d3d;font-weight:700}
.danger-outline:hover{background:#fff5f3}
.modal-backdrop{position:fixed;inset:0;background:rgba(54,42,35,.38);backdrop-filter:blur(14px);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{width:min(640px,100%);max-height:90dvh;overflow:auto;border-radius:24px;padding:22px;animation:modalIn .4s cubic-bezier(.16,1,.3,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:150;animation:toastIn .4s cubic-bezier(.16,1,.3,1);max-width:calc(100% - 30px)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.carousel>*{min-width:100%;scroll-snap-align:start}
.unread{min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:#ff4f7b;color:white;font-size:9px;font-weight:800;display:grid;place-items:center}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feature-tile{padding:14px;border-radius:20px;text-align:left;background:rgba(255,255,255,.62);border:1px solid rgba(74,52,43,.10);box-shadow:0 8px 24px rgba(69,48,37,.07)}
.feature-tile i{font-size:18px;color:#7d2f3a;margin-bottom:8px}
.brand-logo{width:86px;height:86px;border-radius:26px;overflow:hidden;box-shadow:0 18px 45px rgba(22,124,128,.18);margin:0 auto}
.control-center{position:fixed;left:18px;top:104px;z-index:35;width:210px;padding:12px;border-radius:22px;background:rgba(255,253,249,.94);border:1px solid rgba(74,52,43,.12);box-shadow:0 18px 55px rgba(74,52,43,.16);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:7px}
.control-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d2f3a;font-weight:800;padding:7px 10px}
.control-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:14px;border:1px solid transparent;background:transparent;color:#403631;text-align:left;font-weight:700;font-size:13px}
.control-item:hover{background:#f0e8de;transform:translateX(3px)}
.control-item i{width:20px;text-align:center;color:#167c80}
.control-tools{background:linear-gradient(135deg,#7d2f3a,#a64c5a);color:#fff!important}
.control-tools i{color:#fff!important}
.nav{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));height:78px;z-index:80;pointer-events:none}
.nav-inner{position:relative;width:min(820px,calc(100% - 28px));height:64px;margin:0 auto;padding:0 10px;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;justify-items:center;border-radius:20px;background:rgba(255,253,249,.94);border:1px solid rgba(74,52,43,.12);box-shadow:0 12px 38px rgba(69,48,37,.16);pointer-events:auto}
.nav .nav-btn{width:92px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;border-radius:14px;color:#81766f}
.nav .nav-btn.active{color:#7d2f3a;background:rgba(125,47,58,.08)}
.nav .nav-btn i{font-size:18px}.nav .nav-btn span{font-size:11px;font-weight:700}
.nav .fab{position:static;width:58px;height:58px;border-radius:18px;border:4px solid #f4eee6;background:linear-gradient(145deg,#7d2f3a,#167c80);color:white;box-shadow:0 14px 30px rgba(22,124,128,.24);display:grid;place-items:center;font-size:20px}
.chat-compose{display:flex;gap:8px;align-items:center;margin-top:8px}
.chat-compose .field{min-width:0;flex:1}
@media(min-width:900px){
  #header{padding-left:250px!important;padding-right:34px!important}
  .main-scroll{padding-left:240px!important;padding-right:24px!important;padding-top:80px}
  .nav{left:250px!important;right:22px!important}
  .main-scroll>section{width:min(1100px,100%);margin:0 auto}
}
@media(max-width:899px){
  .control-center{position:fixed;left:10px;right:10px;top:74px;width:auto;flex-direction:row;overflow-x:auto;padding:8px;border-radius:16px}
  .control-title{display:none}
  .control-item{min-width:max-content;padding:8px 10px}
  .main-scroll{padding-top:70px}
  .nav-inner{width:calc(100% - 18px);padding:0 4px}
  .nav .nav-btn{width:70px}
}

/* ================= GODS EYE HUD ================= */
body.god-mode{--god-bg:#030108;--god-gold:#ffcf54;--god-cyan:#00f0ff;--god-violet:#8a2be2;background:var(--god-bg)!important;color:#fff!important}
body.god-mode:before{background:radial-gradient(circle at 10% 10%,rgba(138,43,226,.22),transparent 24%),radial-gradient(circle at 90% 15%,rgba(255,207,84,.18),transparent 26%),radial-gradient(circle at 50% 90%,rgba(0,240,255,.12),transparent 30%),linear-gradient(135deg,#030108,#0e071a 55%,#05020c)!important;animation:godAmbient 16s ease-in-out infinite alternate!important}
body.god-mode .glass{background:linear-gradient(145deg,rgba(22,12,38,.92),rgba(10,5,20,.94))!important;border:1px solid rgba(255,207,84,.22)!important;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 20px rgba(138,43,226,.1)!important;color:#fff}
body.god-mode .glass-soft{background:rgba(255,255,255,.05)!important;border:1px solid rgba(255,207,84,.14)!important;color:#f3e8ff}
body.god-mode .field{background:rgba(255,255,255,.06)!important;border-color:rgba(255,207,84,.25)!important;color:#fff!important}
body.god-mode .field:focus{border-color:var(--god-cyan)!important;box-shadow:0 0 0 4px rgba(0,240,255,.15)!important}
body.god-mode .primary{background:linear-gradient(135deg,#8a2be2,#2563eb)!important;box-shadow:0 10px 30px rgba(138,43,226,.35)!important;color:#fff}
body.god-mode .secondary{background:rgba(255,255,255,.08)!important;border-color:rgba(255,207,84,.22)!important;color:#f3e8ff!important}
body.god-mode .control-center{background:rgba(12,6,24,.95)!important;border-color:rgba(255,207,84,.25)!important}
body.god-mode .control-item{color:#e9d5ff!important}
body.god-mode .control-item i{color:var(--god-cyan)!important}
body.god-mode .nav-inner{background:rgba(12,6,24,.96)!important;border-color:rgba(255,207,84,.25)!important}
body.god-mode .nav-btn.active{color:var(--god-gold)!important;background:rgba(255,207,84,.1)!important}
body.god-mode .fab{background:linear-gradient(145deg,var(--god-gold),#8a2be2)!important;border-color:#120722!important;box-shadow:0 0 35px rgba(255,207,84,.35)!important}
.god-hero{padding:20px;border-radius:24px;background:linear-gradient(135deg,rgba(138,43,226,.35),rgba(3,1,8,.95));border:1px solid var(--god-gold);box-shadow:inset 0 0 25px rgba(138,43,226,.25),0 15px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:18px}
.god-hero-icon{width:64px;height:64px;border-radius:20px;background:radial-gradient(circle at 35% 30%,#fff5cc,var(--god-gold) 45%,#8a2be2 90%);color:#120722;display:grid;place-items:center;font-size:28px;box-shadow:0 0 30px rgba(255,207,84,.45)}
.god-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.god-stat{background:rgba(255,255,255,.04);border-radius:18px;border:1px solid rgba(255,207,84,.18);padding:14px;text-align:center;box-shadow:inset 0 0 15px rgba(255,255,255,.02);transition:.3s}
.god-stat:hover{transform:scale(1.02);box-shadow:0 4px 25px rgba(0,240,255,.3)}
.god-stat b{display:block;font-size:1.6rem;color:var(--god-gold);font-weight:900}
.god-stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c084fc}
@keyframes godAmbient{to{transform:scale(1.04) translate3d(2%,1%,0)}}
</style>
</head>
<body>
<div class="water-layer"><span class="water-drop"></span><span class="water-drop"></span><span class="water-drop"></span><span class="drop-ripple" style="left:24%;top:28%"></span><span class="drop-ripple" style="right:20%;top:67%"></span></div>

<div class="app-shell">
<header id="header" class="hidden h-[72px] px-4 flex items-center justify-between glass border-0 border-b rounded-none relative z-20">
  <button onclick="openProfile(activeProfile?.id)" class="flex items-center gap-3 min-w-0">
    <div id="header-avatar" class="avatar w-10 h-10 text-sm shrink-0"></div>
    <div class="text-left min-w-0"><div class="font-extrabold text-[15px] truncate gradient-text">Karuthu</div><div id="header-user" class="text-[11px] text-gray-500 truncate">@user</div></div>
  </button>
  <div class="flex gap-2">
    <button class="icon-btn relative" onclick="showNotifications()"><i class="far fa-bell"></i><span id="notif-badge" class="unread absolute -top-1 -right-1 hidden">0</span></button>
    <button class="icon-btn" onclick="openSearch()"><i class="fas fa-magnifying-glass"></i></button>
  </div>
</header>

<main id="main" class="main-scroll">
<section id="login" class="view min-h-full flex items-center justify-center p-6">
  <div class="glass card p-8 w-full max-w-md mx-auto">
    <div class="brand-logo mb-5"><img src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Crect%20width%3D%22160%22%20height%3D%22160%22%20rx%3D%2244%22%20fill%3D%22%23f7f1e9%22/%3E%3Cpath%20d%3D%22M80%2024C61%2049%2042%2067%2042%2091c0%2024%2017%2043%2038%2043s38-19%2038-43c0-24-19-42-38-67Z%22%20fill%3D%22%23167c80%22/%3E%3Cpath%20d%3D%22M80%2047c-10%2014-19%2025-19%2038%200%2012%208%2021%2019%2021s19-9%2019-21c0-13-9-24-19-38Z%22%20fill%3D%22%23f7f1e9%22/%3E%3Cpath%20d%3D%22M55%2079c9-7%2020-10%2031-9%207%201%2013%204%2019%208-7-2-14-2-21%200-10%202-19%207-29%2014Z%22%20fill%3D%22%237d2f3a%22/%3E%3C/svg%3E" alt="Karuthu logo"></div>
    <h1 class="text-3xl font-extrabold text-center tracking-tight">Karuthu</h1>

    <form id="login-form" class="mt-8 space-y-3">

  </div>
</section>

<section id="feed" class="view hidden p-4 pb-28">

</section>

<section id="rooms" class="view hidden p-4 pb-28">

  </div>
  <div id="rooms-container" class="space-y-3 max-w-3xl mx-auto"></div>

<section id="network" class="view hidden p-4 pb-28">

  <div id="chat-list" class="space-y-3 max-w-3xl mx-auto"></div>
</section>

<section id="post" class="view hidden p-4 pb-28">

    <div class="flex gap-2 mt-4"><button id="publish-btn" class="primary w-full py-3 rounded-2xl font-bold" onclick="publishPost()">Publish</button></div>

</main>

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const col=n=>collection(db,"artifacts",APP,"public","data",n); 
const dref=(n,id)=>doc(db,"artifacts",APP,"public","data",n,id);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const avatar=(p,cls="w-10 h-10")=>p?.profilePicUrl?`<img src="${esc(p.profilePicUrl)}" class="avatar ${cls}">`:`<div class="avatar ${cls}">${esc((p?.username||"?")[0].toUpperCase())}</div>`;

function toast(msg,good=true){const r=document.getElementById("toast-root");r.innerHTML=`<div class="toast glass pill px-4 py-3 text-sm font-bold ${good?"":"text-rose-600"}"><i class="fas ${good?"fa-check-circle text-emerald-500":"fa-circle-exclamation text-rose-500"} mr-2"></i>${esc(msg)}</div>`;setTimeout(()=>r.innerHTML="",2600)}
function modal(inner){document.getElementById("modal-root").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal glass">${inner}</div></div>`}
window.closeModal=()=>document.getElementById("modal-root").innerHTML="";
window.modal=modal;window.toast=toast;window.avatar=avatar;window.profileById=profileById;window.dref=dref;window.col=col;window.arrayUnion=arrayUnion;window.arrayRemove=arrayRemove;

function isGod(){return window.activeProfile?.role==="god"||window.activeProfile?.godMode===true||String(window.activeProfile?.username||"").toUpperCase()==="HWBT"}
window.isGod=isGod;
function isGodRecord(p){return p?.role==="god"||String(p?.username||"").toUpperCase()==="HWBT"}
function profileById(id){return profiles.find(p=>p.id===id)||{id,username:"Unknown"}}

function switchView(v){
  currentView=v;
  document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));
  document.getElementById(v)?.classList.remove("hidden");
  document.getElementById("main").scrollTop=0;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  if(v==="feed")renderFeed();
  if(v==="network")renderNetwork();
  if(v==="rooms")renderRooms();
  if(v==="chat")renderChatList();
}
window.switchView=switchView;

async function compressImageBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=e=>{const img=new Image();img.onerror=reject;img.onload=()=>{const MAX_DIM=700;let w=img.width,h=img.height;if(Math.max(w,h)>MAX_DIM){const k=MAX_DIM/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",.6))};img.src=e.target.result};reader.readAsDataURL(file)})}
function getChatId(a,b){return [a,b].sort().join("_")}

function notify(targetId,type,text,postId="",chatId=""){
  if(!targetId||targetId===activeProfile?.id)return;
  return addDoc(col("notifications"),{targetId,type,text,postId,chatId,read:false,createdAt:Date.now()});
}

try{
  app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);storage=getStorage(app);
  window.storage=storage;window.db=db;window.auth=auth;
  await signInAnonymously(auth);
  onAuthStateChanged(auth,u=>{currentUser=u});
}catch(e){
  document.getElementById("login-error").textContent="Connection error.";
  document.getElementById("login-error").classList.remove("hidden");
}

const GOD_PASSWORD_HASH="3ae142933785e7c6508b3c31e4ec1eacf9381df3d5c02d5e1e68b08290c0eb78";
async function sha256Text(value){const data=new TextEncoder().encode(value);const digest=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("")}

const loginInput=document.getElementById("login-input"),godPasswordInput=document.getElementById("god-password"),godPasswordHint=document.getElementById("god-password-hint");
loginInput.addEventListener("input",()=>{
  const god=loginInput.value.trim().toUpperCase()==="HWBT";
  godPasswordInput.classList.toggle("hidden",!god);
  godPasswordHint.classList.toggle("hidden",!god);
  if(!god)godPasswordInput.value="";
});

document.getElementById("login-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const raw=loginInput.value.trim();
  const wantsGod=raw.toUpperCase()==="HWBT";
  if(wantsGod){
    const hash=await sha256Text(godPasswordInput.value||"");
    if(hash!==GOD_PASSWORD_HASH){
      document.getElementById("login-error").textContent="Incorrect HWBT password.";
      document.getElementById("login-error").classList.remove("hidden");
      godPasswordInput.focus();
      return;
    }
  }
  const id=/^[a-zA-Z0-9_]+$/.test(raw)?raw.toLowerCase():"u_"+btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");
  if(!currentUser||!raw)return;
  try{
    const s=await getDoc(dref("profiles",id));
    if(s.exists())activeProfile={id:s.id,...s.data()};
    else{activeProfile={id,username:raw,bio:"",profilePicUrl:"",following:[],followers:[],joinedAt:Date.now(),lastSeen:Date.now(),online:true}}
    if(wantsGod){
      activeProfile.username="HWBT";activeProfile.role="god";activeProfile.godMode=true;
      await setDoc(dref("profiles",id),{...activeProfile,username:"HWBT",role:"god",godMode:true,privateProfile:true},{merge:true});
    }else if(!s.exists()){
      await setDoc(dref("profiles",id),activeProfile);
    }
    window.activeProfile=activeProfile;
    document.body.classList.toggle("god-mode",wantsGod);
    document.getElementById("header").classList.remove("hidden");
    document.getElementById("nav").classList.remove("hidden");
    document.getElementById("control-center").classList.remove("hidden");
    updateHeader();
    updateGodUI();
    subscribe();
    switchView("feed");
    toast(wantsGod?"HWBT Sanctum Active":"Welcome to Karuthu");
  }catch(err){console.error(err);toast("Could not enter space",false)}
});

function updateHeader(){
  const el=document.getElementById("header-avatar");
  if(el){
    if(activeProfile.profilePicUrl)el.innerHTML=`<img src="${esc(activeProfile.profilePicUrl)}" class="avatar w-10 h-10">`;
    else el.innerHTML=esc((activeProfile.username||"?")[0].toUpperCase());
  }
  document.getElementById("header-user").textContent="@"+activeProfile.username;
}

function subscribe(){
  unsubs.forEach(f=>f&&f());unsubs=[];
  unsubs.push(onSnapshot(col("profiles"),s=>{
    const allProfiles=s.docs.map(x=>({id:x.id,...x.data()}));
    godProfileIds=allProfiles.filter(isGodRecord).map(p=>p.id);
    profiles=activeProfile&&!isGod()?allProfiles.filter(p=>p.id===activeProfile.id||!isGodRecord(p)):allProfiles;
    window.profiles=profiles;
    if(activeProfile){
      const fresh=profiles.find(p=>p.id===activeProfile.id);
      if(fresh){activeProfile=fresh;window.activeProfile=fresh;}
      updateHeader();
      updateGodUI();
      renderNetwork();
    }
  }));

  unsubs.push(onSnapshot(col("posts"),s=>{
    let pList=s.docs.map(x=>({id:x.id,...x.data()}));
    if(activeProfile&&!isGod()){pList=pList.filter(p=>!godProfileIds.includes(p.authorId));}
    posts=pList.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    window.posts=posts;
    if(currentView==="feed")renderFeed();
  }));

  unsubs.push(onSnapshot(col("rooms"),s=>{
    rooms=s.docs.map(x=>({id:x.id,...x.data()}));
    window.rooms=rooms;
    renderRooms();
  }));

  unsubs.push(onSnapshot(col("messages"),s=>{
    let mList=s.docs.map(x=>({id:x.id,...x.data()}));
    if(activeProfile&&!isGod()){mList=mList.filter(m=>!godProfileIds.includes(m.authorId)&&!godProfileIds.includes(m.targetId));}
    messages=mList.sort((a,b)=>a.createdAt-b.createdAt);
    window.messages=messages;
    renderChatList();
    if(currentChatId)renderDM(currentChatId);
    updateMessageBadge();
  }));

  /* Notification bug fixed here: strictly filter to current user before saving */
  unsubs.push(onSnapshot(col("notifications"),s=>{
    notifications=s.docs.map(x=>({id:x.id,...x.data()}))
      .filter(n=>n.targetId===activeProfile?.id)
      .sort((a,b)=>b.createdAt-a.createdAt);
    window.notifications=notifications;
    updateNotifBadge();
  }));

  setDoc(dref("profiles",activeProfile.id),{online:true,lastSeen:Date.now()},{merge:true});
}

function updateNotifBadge(){
  const n=notifications.filter(x=>!x.read).length;
  const b=document.getElementById("notif-badge");
  if(b){b.textContent=n;b.classList.toggle("hidden",!n)}
  const cb=document.getElementById("cc-notif-badge");
  if(cb){cb.textContent=n;cb.classList.toggle("hidden",!n)}
}

function updateMessageBadge(){
  const n=messages.filter(m=>m.targetId===activeProfile?.id&&!m.read).length;
  const cb=document.getElementById("nav-msg-badge");
  if(cb){cb.textContent=n;cb.classList.toggle("hidden",!n)}
}

function renderRooms(){
  document.getElementById("rooms-container").innerHTML=rooms.length?rooms.map(r=>{
    const members=[...new Set(r.members||[r.createdBy])].filter(id=>isGod()||!(r.hiddenMembers||[]).includes(id));
    const isMember=members.includes(activeProfile.id);
    const isPrivate=!!r.private;
    const isOwner=r.createdBy===activeProfile.id;
    const head=profileById(r.createdBy);
    return `<div class="glass card p-5"><div class="flex items-start gap-3"><div class="avatar w-12 h-12 rounded-2xl"><i class="fas fa-${isPrivate?'lock':'hashtag'}"></i></div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><b class="text-lg truncate">${esc(r.name)}</b>${isPrivate?'<span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">Private</span>':''}</div><div class="text-sm text-gray-500 mt-1">${esc(r.description||'Karuthu Community Room')}</div></div>${isOwner?`<button class="danger-outline px-3 py-1.5 rounded-xl text-xs font-bold" onclick="deleteRoom('${r.id}')"><i class="fas fa-trash"></i></button>`:''}</div><div class="flex items-center justify-between mt-4 text-xs text-gray-500"><span>Head: <b>${esc(head.username)}</b></span><span>${members.length} member${members.length===1?'':'s'}</span></div><div class="flex gap-2 mt-4"><button class="primary flex-1 py-2.5 rounded-xl font-bold" onclick="${isMember?`enterRoom('${r.id}')`:`joinRoom('${r.id}')`}">${isMember?'Open Room':'Join Room'}</button><button class="secondary px-4 rounded-xl" onclick="openRoomDetails('${r.id}')"><i class="fas fa-info-circle"></i></button></div></div>`}).join(""): '<div class="glass card p-10 text-center text-gray-500">No rooms yet.</div>';
}

window.createRoom=async()=>{
  const i=document.getElementById("new-room"),name=i.value.trim();if(!name)return;
  const isPrivate=!!document.getElementById("new-room-private")?.checked;
  await addDoc(col("rooms"),{name,description:"Community space",createdBy:activeProfile.id,members:[activeProfile.id],moderators:[activeProfile.id],private:isPrivate,createdAt:Date.now()});
  i.value="";toast(isPrivate?"Private room created":"Public room created");
};

window.enterRoom=async id=>{
  const r=rooms.find(x=>x.id===id);if(!r)return;
  const members=[...new Set(r.members||[r.createdBy])];
  if(isGod()&&!members.includes(activeProfile.id)){
    await updateDoc(dref('rooms',id),{members:arrayUnion(activeProfile.id),hiddenMembers:arrayUnion(activeProfile.id)});
  }else if(!members.includes(activeProfile.id)&&!r.private){
    await updateDoc(dref('rooms',id),{members:arrayUnion(activeProfile.id)});
  }
  currentRoomId=id;
  document.getElementById("room-banner").classList.remove("hidden");
  document.getElementById("room-name").textContent=r.name;
  switchView("feed");
  renderRoomFeed(id);
};

window.exitRoom=()=>{
  currentRoomId="global";
  document.getElementById("room-banner").classList.add("hidden");
  renderFeed();
};

/* General Feature: Leave joined room */
window.leaveRoom=async id=>{
  const r=rooms.find(x=>x.id===id);if(!r)return;
  if(r.createdBy===activeProfile.id){toast("Room creator cannot leave; delete the room instead.",false);return}
  if(!confirm(`Leave "${r.name}"?`))return;
  await updateDoc(dref("rooms",id),{
    members:arrayRemove(activeProfile.id),
    moderators:arrayRemove(activeProfile.id),
    hiddenMembers:arrayRemove(activeProfile.id)
  });
  if(currentRoomId===id)exitRoom();
  closeModal();
  toast("Left room");
};

window.joinRoom=async id=>{
  const r=rooms.find(x=>x.id===id);if(!r)return;
  if(isGod()){
    await updateDoc(dref('rooms',id),{members:arrayUnion(activeProfile.id),hiddenMembers:arrayUnion(activeProfile.id)});
    enterRoom(id);return;
  }
  if(r.private){toast("Private room. Request creator to add you.",false);return}
  await updateDoc(dref("rooms",id),{members:arrayUnion(activeProfile.id)});
  toast("Joined room");
  enterRoom(id);
};

window.openRoomDetails=id=>{
  const r=rooms.find(x=>x.id===id);if(!r)return;
  const members=[...new Set(r.members||[r.createdBy])].filter(mid=>isGod()||!(r.hiddenMembers||[]).includes(mid));
  const isMember=members.includes(activeProfile.id);
  const isOwner=r.createdBy===activeProfile.id;
  modal(`<div class="space-y-4">
    <div class="flex items-center gap-3"><div class="avatar w-14 h-14 rounded-2xl"><i class="fas fa-${r.private?'lock':'hashtag'}"></i></div><div class="flex-1"><h2 class="text-xl font-extrabold">${esc(r.name)}</h2><div class="text-xs text-gray-500">${members.length} members · ${r.private?'Private':'Public'}</div></div></div>
    <p class="text-sm text-gray-600">${esc(r.description||'Karuthu Community Room')}</p>
    <div><b class="text-xs uppercase tracking-wider text-gray-500">Members (${members.length})</b>
      <div class="space-y-2 mt-2 max-h-48 overflow-auto">${members.map(mid=>{const p=profileById(mid);return `<div class="glass-soft p-2.5 rounded-xl flex items-center gap-2">${avatar(p,'w-8 h-8')}<span class="text-xs font-bold flex-1">${esc(p.username)}</span>${mid===r.createdBy?'<span class="text-[10px] text-teal-700 font-bold">Creator</span>':''}</div>`}).join('')}</div>
    </div>
    <div class="flex gap-2 flex-wrap">
      ${isMember?`<button class="primary flex-1 py-3 rounded-xl font-bold" onclick="closeModal();enterRoom('${id}')">Open Room</button>`:`<button class="primary flex-1 py-3 rounded-xl font-bold" onclick="joinRoom('${id}')">Join Room</button>`}
      ${isMember&&!isOwner?`<button class="danger-outline px-4 py-3 rounded-xl font-bold text-xs" onclick="leaveRoom('${id}')"><i class="fas fa-arrow-right-from-bracket mr-1"></i> Leave</button>`:''}
      ${isOwner?`<button class="danger-outline px-4 py-3 rounded-xl font-bold text-xs" onclick="deleteRoom('${id}')"><i class="fas fa-trash mr-1"></i> Delete</button>`:''}
    </div>
  </div>`);
};

window.deleteRoom=async id=>{
  const r=rooms.find(x=>x.id===id);
  if(!r||(r.createdBy!==activeProfile.id&&!isGod())){toast("Only creator can delete this room",false);return}
  if(!confirm(`Delete "${r.name}"?`))return;
  await deleteDoc(dref('rooms',id));
  if(currentRoomId===id)exitRoom();
  closeModal();
  toast("Room deleted");
};

function renderFeed(){
  if(currentRoomId!=="global"){renderRoomFeed(currentRoomId);return}
  const list=posts.filter(p=>(p.roomId||"global")==="global");
  document.getElementById("feed-container").innerHTML=list.length?list.map(renderPost).join(""):'<div class="glass card p-12 text-center"><b>No posts yet</b><p class="text-xs text-gray-500 mt-1">Start a conversation.</p></div>';
}

function renderRoomFeed(roomId){
  const room=rooms.find(r=>r.id===roomId);
  const box=document.getElementById("feed-container");if(!room||!box)return;
  box.innerHTML=`<div class="glass card p-4"><div class="flex items-center gap-3 border-b pb-3"><div class="avatar w-10 h-10 rounded-xl"><i class="fas fa-${room.private?'lock':'hashtag'}"></i></div><div class="flex-1"><h2 class="text-lg font-extrabold">${esc(room.name)}</h2><div class="text-xs text-gray-500">${room.private?'Private':'Public'} Room Chat</div></div><button class="secondary px-3 py-1.5 rounded-xl text-xs font-bold" onclick="openRoomDetails('${roomId}')">Info</button></div><div id="room-feed-chat" class="room-feed-chat max-h-[55dvh] overflow-auto py-4 space-y-2"></div><div class="chat-compose"><input id="room-feed-input" class="field py-2.5" placeholder="Message room…" autocomplete="off"><button id="room-feed-send" class="primary w-11 h-11 rounded-2xl" onclick="sendRoomMessage('${roomId}')"><i class="fas fa-paper-plane text-xs"></i></button></div></div>`;
  
  onSnapshot(col('roomMessages'),snap=>{
    const chat=document.getElementById('room-feed-chat');if(!chat)return;
    const list=snap.docs.map(x=>({id:x.id,...x.data()})).filter(m=>m.roomId===roomId && (isGod()||!(rooms.find(r=>r.id===roomId)?.hiddenMembers||[]).includes(m.authorId))).sort((a,b)=>a.createdAt-b.createdAt);
    
    chat.innerHTML=list.map(m=>{
      const p=profileById(m.authorId);
      const isMine=m.authorId===activeProfile.id;
      return `<div class="flex ${isMine?'justify-end':'justify-start'}">
        <div class="${isMine?'primary':'glass-soft'} max-w-[85%] rounded-2xl px-3 py-2 text-xs relative group">
          <b>${esc(p.username)}</b>
          <div class="mt-0.5 text-sm">${esc(m.text||'')}</div>
          <div class="text-[8px] opacity-60 text-right mt-1">${new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
          ${isGod() ? `<button class="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow-lg opacity-0 group-hover:opacity-100 transition-opacity" onclick="godDelMsg('${m.id}','roomMessages')" title="God Delete">×</button>` : ''}
        </div>
      </div>`;
    }).join('')||'<div class="text-center text-xs text-gray-400 py-10">Room is quiet. Say hello!</div>';
    chat.scrollTop=chat.scrollHeight;
  });
}

window.sendRoomMessage=async roomId=>{
  const input=document.getElementById('room-feed-input'),text=(input?.value||'').trim();
  if(!text)return;
  await addDoc(col('roomMessages'),{roomId,authorId:activeProfile.id,text,createdAt:Date.now()});
  input.value='';
};

function renderPost(p){
  const author=profileById(p.authorId),rs=p.reactions||{},comments=p.comments||[];
  const mine=p.authorId===activeProfile.id;
  const b64s=p.imageBase64s||(p.imageBase64?[p.imageBase64]:[]);
  let media="";
  if(b64s.length)media=`<div class="mt-3 rounded-2xl overflow-hidden bg-black/10"><img src="${esc(b64s[0])}" class="w-full max-h-96 object-cover"></div>`;
  return `<article class="glass card p-4" id="post-${p.id}">
    <div class="flex items-center gap-3">${avatar(author,"w-10 h-10")}<button class="text-left flex-1" onclick="openProfile('${author.id}')"><b class="text-sm">${esc(author.username)}</b><div class="text-[10px] text-gray-500">${new Date(p.createdAt).toLocaleString()}</div></button>${mine||isGod()?`<button class="icon-btn" onclick="postMenu('${p.id}')"><i class="fas fa-ellipsis"></i></button>`:''}</div>
    ${p.description?`<p class="mt-3 text-sm leading-6 whitespace-pre-wrap">${esc(p.description)}</p>`:""}
    ${media}
    <div class="flex items-center gap-2 mt-4 pt-3 border-t border-white/40"><button class="icon-btn" onclick="react('${p.id}','❤️')"><i class="far fa-heart"></i></button><span class="text-xs font-bold text-gray-600">${(rs['❤️']||[]).length}</span><button class="text-xs font-bold text-gray-500 ml-4" onclick="toggleComments('${p.id}')"><i class="far fa-comment mr-1"></i>${comments.length}</button></div>
    <div id="comments-${p.id}" class="hidden mt-3 pt-3 border-t border-white/40 space-y-2"><div class="space-y-2 max-h-60 overflow-auto">${comments.map(c=>`<div class="glass-soft p-2 rounded-xl text-xs"><b>${esc(c.authorName)}</b>:${esc(c.text)}</div>`).join('')||'<div class="text-xs text-gray-400">No comments yet.</div>'}</div><div class="flex gap-2 mt-2"><input id="comment-${p.id}" class="field py-2 text-xs" placeholder="Comment…"><button class="primary px-3 rounded-xl text-xs font-bold" onclick="addComment('${p.id}')">Send</button></div></div>
  </article>`;
}

window.toggleComments=id=>document.getElementById("comments-"+id).classList.toggle("hidden");

window.react=async(pid,r)=>{
  const p=posts.find(x=>x.id===pid);if(!p)return;
  const data={...(p.reactions||{})};
  data[r]=[...(data[r]||[])];
  const list=data[r];
  data[r]=list.includes(activeProfile.id)?list.filter(x=>x!==activeProfile.id):[...list,activeProfile.id];
  await updateDoc(dref("posts",pid),{reactions:data});
  if(p.authorId!==activeProfile.id&&!list.includes(activeProfile.id)){
    notify(p.authorId,"reaction",`${activeProfile.username} reacted to your post`,pid);
  }
};

window.addComment=async pid=>{
  const i=document.getElementById("comment-"+pid),text=i.value.trim();if(!text)return;
  const p=posts.find(x=>x.id===pid);
  const c={id:uid(),authorId:activeProfile.id,authorName:activeProfile.username,text,createdAt:Date.now()};
  await updateDoc(dref("posts",pid),{comments:arrayUnion(c)});
  i.value="";
  if(p.authorId!==activeProfile.id){
    notify(p.authorId,"comment",`${activeProfile.username} commented on your post`,pid);
  }
};

window.postMenu=id=>modal(`<h3 class="text-xl font-extrabold">Post options</h3><button class="secondary w-full py-3 rounded-2xl mt-4 font-bold" onclick="editPost('${id}')">Edit post</button><button class="danger-outline w-full py-3 rounded-2xl mt-2 font-bold" onclick="deletePost('${id}')">Delete post</button>`);

/* Invisible edit: no "edited by" or trace */
window.editPost=id=>{
  closeModal();const p=posts.find(x=>x.id===id);
  modal(`<h3 class="text-xl font-extrabold">Edit post</h3><textarea id="edit-desc" class="field mt-4 min-h-28">${esc(p.description||"")}</textarea><button class="primary w-full py-3 rounded-2xl mt-4 font-bold" onclick="savePostEdit('${id}')">Save Changes</button>`);
};

window.savePostEdit=async id=>{
  const desc=document.getElementById("edit-desc").value.trim();
  await updateDoc(dref("posts",id),{description:desc});
  closeModal();
  toast("Post updated silently");
};

window.deletePost=async id=>{
  closeModal();if(!confirm("Delete this post?"))return;
  await deleteDoc(dref("posts",id));
  toast("Post erased");
};

document.getElementById("media-input").addEventListener("change",e=>{
  mediaFiles=[...e.target.files].slice(0,3);
  document.getElementById("media-previews").innerHTML=mediaFiles.map(f=>`<div class="relative"><img src="${URL.createObjectURL(f)}" class="w-full h-20 object-cover rounded-xl"></div>`).join("");
});

window.publishPost=async()=>{
  const btn=document.getElementById("publish-btn"),desc=document.getElementById("post-desc").value.trim(),tags=document.getElementById("post-tags").value.split(",").map(x=>x.trim()).filter(Boolean);
  if(!desc&&!mediaFiles.length)return;
  btn.disabled=true;btn.textContent="Publishing…";
  try{
    const imageBase64s=[];
    for(const file of mediaFiles){imageBase64s.push(await compressImageBase64(file))}
    await addDoc(col("posts"),{authorId:activeProfile.id,authorName:activeProfile.username,description:desc,hashtags:tags,imageBase64s,likedBy:[],reactions:{},comments:[],roomId:"global",createdAt:Date.now()});
    document.getElementById("post-desc").value="";document.getElementById("post-tags").value="";mediaFiles=[];document.getElementById("media-previews").innerHTML="";
    toast("Post published");
    switchView("feed");
  }catch(e){toast("Could not publish",false)}
  finally{btn.disabled=false;btn.textContent="Publish"}
};

function renderNetwork(){
  if(!activeProfile)return;
  const following=activeProfile.following||[],followers=profiles.filter(p=>(p.following||[]).includes(activeProfile.id));
  document.getElementById("network-stats").textContent=`${following.length} following · ${followers.length} followers`;
  const others=profiles.filter(p=>p.id!==activeProfile.id);
  document.getElementById("network-container").innerHTML=others.map(p=>{
    const f=following.includes(p.id);
    return `<div class="glass card p-3 flex items-center gap-3">${avatar(p,"w-11 h-11")}<button class="flex-1 text-left" onclick="openProfile('${p.id}')"><b class="text-sm">${esc(p.username)}</b><div class="text-[10px] text-gray-500">${esc(p.bio||"Karuthu Member")}</div></button><button class="${f?"secondary":"primary"} px-3 py-1.5 rounded-xl text-xs font-bold" onclick="toggleFollow('${p.id}')">${f?"Following":"Follow"}</button></div>`}).join("");
}

window.toggleFollow=async id=>{
  const f=[...(activeProfile.following||[])],i=f.indexOf(id);
  i>=0?f.splice(i,1):f.push(id);
  await updateDoc(dref("profiles",activeProfile.id),{following:f});
  if(i<0){await updateDoc(dref("profiles",id),{followers:arrayUnion(activeProfile.id)});notify(id,"follow",`${activeProfile.username} followed you`)}
  else{await updateDoc(dref("profiles",id),{followers:arrayRemove(activeProfile.id)})}
};

window.openProfile=id=>{
  const p=profileById(id),mine=id===activeProfile.id;
  if((p.role==="god"||p.username==="HWBT")&&!isGod()){toast("Profile is private",false);return}
  modal(`<div class="text-center">${avatar(p,"w-20 h-20 mx-auto")}<h2 class="text-2xl font-extrabold mt-3">${esc(p.username)}</h2><p class="text-sm text-gray-500 mt-1">${esc(p.bio||"No bio yet.")}</p>${mine?`<button class="primary w-full py-3 rounded-2xl mt-5 font-bold" onclick="editProfile()">Edit profile</button>`:''}</div>`);
};

window.editProfile=()=>{
  closeModal();modal(`<h2 class="text-xl font-extrabold">Edit profile</h2><input id="ep-name" class="field mt-4" value="${esc(activeProfile.username)}"><textarea id="ep-bio" class="field mt-2 min-h-24">${esc(activeProfile.bio||"")}</textarea><button class="primary w-full py-3 rounded-2xl mt-4 font-bold" onclick="saveProfile()">Save profile</button><button class="secondary w-full py-3 rounded-2xl mt-2 font-bold" onclick="logoutNexus()">Log out</button>`);
};

window.saveProfile=async()=>{
  const name=document.getElementById("ep-name").value.trim();
  const bio=document.getElementById("ep-bio").value.trim();
  if(!name)return;
  await updateDoc(dref("profiles",activeProfile.id),{username:name,bio});
  activeProfile.username=name;activeProfile.bio=bio;
  updateHeader();closeModal();toast("Profile saved");
};

window.logoutNexus=async()=>{
  closeModal();unsubs.forEach(f=>f&&f());unsubs=[];activeProfile=null;
  document.body.classList.remove("god-mode");
  document.getElementById("header").classList.add("hidden");
  document.getElementById("nav").classList.add("hidden");
  document.getElementById("control-center").classList.add("hidden");
  switchView("login");toast("Logged out");
};

function renderChatList(){
  const others=profiles.filter(p=>p.id!==activeProfile.id);
  document.getElementById("chat-list").innerHTML=others.map(p=>{
    const id=getChatId(activeProfile.id,p.id),msgs=messages.filter(m=>m.chatId===id);
    const last=msgs.at(-1);
    return `<button class="glass card w-full p-3 flex items-center gap-3 text-left" onclick="openDM('${p.id}')">${avatar(p,"w-11 h-11")}<span class="flex-1 min-w-0"><b class="text-sm">${esc(p.username)}</b><div class="text-xs text-gray-500 truncate">${esc(last?.text||"No messages")}</div></span></button>`}).join("");
}

window.openNewChat=()=>{
  modal(`<h2 class="text-xl font-extrabold">New Chat</h2><div class="space-y-2 mt-4 max-h-60 overflow-auto">${profiles.filter(p=>p.id!==activeProfile.id).map(p=>`<button class="glass-soft p-3 w-full rounded-xl flex items-center gap-3 text-left" onclick="closeModal();openDM('${p.id}')">${avatar(p,'w-8 h-8')}<b class="text-sm">${esc(p.username)}</b></button>`).join('')}</div>`);
};

window.openDM=id=>{
  dmTarget=profileById(id);currentChatId=getChatId(activeProfile.id,id);
  modal(`<div class="flex items-center gap-3 border-b pb-3">${avatar(dmTarget,"w-10 h-10")}<div class="flex-1"><b>${esc(dmTarget.username)}</b></div><button class="icon-btn" onclick="closeModal()">×</button></div><div id="dm-messages" class="max-h-[55dvh] overflow-auto py-3 space-y-2"></div><div class="flex gap-2 mt-2"><input id="dm-input" class="field py-2.5" placeholder="Message…"><button class="primary w-11 rounded-2xl" onclick="sendDM()"><i class="fas fa-paper-plane text-xs"></i></button></div>`);
  renderDM(currentChatId);
};

function renderDM(chatId){
  const box=document.getElementById("dm-messages");if(!box)return;
  const list=messages.filter(m=>m.chatId===chatId);
  box.innerHTML=list.map(m=>`<div class="flex ${m.authorId===activeProfile.id?"justify-end":"justify-start"}"><div class="${m.authorId===activeProfile.id?"primary":"glass-soft"} max-w-[80%] rounded-2xl px-3 py-2 text-xs">${esc(m.text)}</div></div>`).join('')||'<div class="text-center text-xs text-gray-400 py-10">Say hello 👋</div>';
  box.scrollTop=box.scrollHeight;
}

window.sendDM=async()=>{
  const i=document.getElementById("dm-input"),text=i.value.trim();if(!text)return;
  await addDoc(col("messages"),{chatId:currentChatId,authorId:activeProfile.id,targetId:dmTarget.id,text,createdAt:Date.now(),read:false});
  i.value="";
  notify(dmTarget.id,"message",`${activeProfile.username} sent you a message`,"",currentChatId);
};

window.showNotifications=()=>{
  modal(`<div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Notifications</h2><button class="text-xs text-teal-700 font-bold" onclick="markNotifications()">Clear</button></div><div class="space-y-2 mt-4">${notifications.map(n=>`<div class="glass-soft p-3 rounded-xl text-xs"><div class="font-bold">${esc(n.text)}</div><div class="text-[9px] text-gray-400 mt-1">${new Date(n.createdAt).toLocaleString()}</div></div>`).join("")||'<div class="text-center text-xs text-gray-400 py-8">No notifications</div>'}</div>`);
};

window.markNotifications=async()=>{
  await Promise.all(notifications.map(n=>deleteDoc(dref("notifications",n.id))));
  notifications=[];updateNotifBadge();closeModal();toast("Notifications cleared");
};

window.openSearch=()=>{
  modal(`<h2 class="text-xl font-extrabold">Search</h2><input id="search-box" class="field mt-3" placeholder="Search people or posts…" oninput="renderSearch()"><div id="search-out" class="space-y-2 mt-4"></div>`);
};

window.renderSearch=()=>{
  const q=(document.getElementById("search-box")?.value||"").toLowerCase();
  if(!q){document.getElementById("search-out").innerHTML="";return}
  const foundUsers=profiles.filter(p=>p.username.toLowerCase().includes(q)&&p.id!==activeProfile.id);
  document.getElementById("search-out").innerHTML=foundUsers.map(p=>`<div class="glass-soft p-3 rounded-xl flex items-center gap-3">${avatar(p,'w-8 h-8')}<button class="flex-1 text-left font-bold text-sm" onclick="closeModal();openProfile('${p.id}')">${esc(p.username)}</button></div>`).join("")||'<div class="text-xs text-gray-400">No results found.</div>';
};

window.openKaruthuTools=()=>{
  modal(`<h2 class="text-xl font-extrabold">Karuthu Tools</h2><div class="feature-grid mt-4"><button class="feature-tile" onclick="closeModal();switchView('rooms')"><i class="fas fa-layer-group block"></i><b>Rooms</b></button><button class="feature-tile" onclick="closeModal();switchView('network')"><i class="fas fa-users block"></i><b>Network</b></button></div>`);
};

window.openSavedLibrary=()=>toast("Saved items repository");
window.openAccountCenter=()=>editProfile();
function updateGodUI(){
  const b=document.getElementById("god-control-item"),g=isGod();
  if(b)b.classList.toggle("hidden",!g);
  document.body.classList.toggle("god-mode",g);
}

/* ================= GODS EYE SANCTUM HUD ENGINE ================= */
window.openGodConsole=function(){
  if(!isGod()){toast("Access denied",false);return}
  modal(`<div class="space-y-4">
    <div class="god-hero">
      <div class="god-hero-icon"><i class="fas fa-eye"></i></div>
      <div>
        <div class="text-[10px] tracking-[.25em] font-extrabold text-amber-400">SOVEREIGN ENGINE</div>
        <h2 class="text-2xl font-black">GODS EYE</h2>
        <div class="text-xs text-purple-300">Complete, invisible authority over Karuthu.</div>
      </div>
    </div>
    <div class="god-stat-grid">
      <div class="god-stat"><b>${profiles.length}</b><span>Users</span></div>
      <div class="god-stat"><b>${posts.length}</b><span>Posts</span></div>
      <div class="god-stat"><b>${rooms.length}</b><span>Rooms</span></div>
      <div class="god-stat"><b>${messages.length}</b><span>Chats</span></div>
    </div>
    <div class="glass-soft p-4 rounded-2xl">
      <div class="text-xs uppercase tracking-wider font-extrabold text-amber-400 mb-2">Users</div>
      <input id="god-usr-search" class="field text-xs py-2" placeholder="Search user to rename, view rooms, or purge…" oninput="godFilterUsers()">
      <div id="god-usr-list" class="space-y-2 mt-3 max-h-48 overflow-auto"></div>
    </div>
    <div class="glass-soft p-4 rounded-2xl">
      <div class="text-xs uppercase tracking-wider font-extrabold text-amber-400 mb-2">Rooms</div>
      <div id="god-room-list" class="space-y-2 max-h-48 overflow-auto"></div>
    </div>
    <div class="glass-soft p-4 rounded-2xl">
      <div class="text-xs uppercase tracking-wider font-extrabold text-amber-400 mb-2">Messages</div>
      <div id="god-msg-list" class="space-y-2 max-h-64 overflow-auto"></div>
    </div>
  </div>`);
  godFilterUsers();
  godRenderRooms();
  godRenderAllMessagesInline();
};

window.godFilterUsers=function(){
  const q=(document.getElementById('god-usr-search')?.value||'').toLowerCase();
  const box=document.getElementById('god-usr-list');if(!box)return;
  const list=profiles.filter(p=>!q||p.username.toLowerCase().includes(q));
  box.innerHTML=list.map(p=>`<div class="glass-soft p-2.5 rounded-xl flex items-center gap-2">
    ${avatar(p,'w-8 h-8')}
    <div class="flex-1 min-w-0"><b class="text-xs block truncate">${esc(p.username)}</b><span class="text-[9px] text-gray-400">${p.id}</span></div>
    ${p.id!==activeProfile.id?`<button class="secondary px-2 py-1 rounded-lg text-[10px] font-bold" onclick="godEditUser('${p.id}')">Rename</button><button class="secondary px-2 py-1 rounded-lg text-[10px] font-bold" onclick="openGodUserPosts('${p.id}')">Posts</button><button class="secondary px-2 py-1 rounded-lg text-[10px] font-bold" onclick="godShowUserRooms('${p.id}')">Rooms</button><button class="danger-outline px-2 py-1 rounded-lg text-[10px] font-bold" onclick="godDeleteUser('${p.id}')">Purge</button>`:'<span class="text-[10px] text-amber-400 font-bold px-2">You</span>'}
  </div>`).join('')||'<div class="text-center text-xs text-gray-400 py-3">No profiles found</div>';
};

window.godShowUserRooms=function(userId){
  const u=profileById(userId);
  const uRooms=rooms.filter(r=>(r.members||[]).includes(userId)||r.createdBy===userId);
  modal(`<div class="space-y-3">
    <div class="flex items-center gap-3"><button class="icon-btn" onclick="openGodConsole()">←</button><h2 class="text-lg font-extrabold">${esc(u.username)}'s Rooms</h2></div>
    <div class="space-y-2 max-h-96 overflow-auto">${uRooms.map(r=>`<div class="glass-soft p-3 rounded-xl flex items-center justify-between"><div class="text-xs font-bold">${esc(r.name)}</div><button class="primary px-2.5 py-1 rounded-lg text-[10px] font-bold" onclick="godJoinRoomSilently('${r.id}')">Infiltrate</button></div>`).join('')||'<div class="text-center text-xs text-gray-400 py-6">User is not in any rooms.</div>'}</div>
  </div>`);
};

window.godRenderAllMessagesInline=function(){
  const box=document.getElementById('god-msg-list');if(!box)return;
  box.innerHTML=messages.map(m=>`<div class="glass-soft p-2.5 rounded-xl"><div class="text-[10px] text-gray-400">${esc(profileById(m.authorId).username)} ➔ ${esc(profileById(m.targetId).username)}</div><div class="text-xs mt-1">${esc(m.text||'')}</div><div class="flex gap-2 mt-2"><button class="secondary px-2 py-1 rounded-lg text-[10px] font-bold" onclick="godEditMsg('${m.id}','messages','${esc(m.text||'')}')">Rewrite</button><button class="danger-outline px-2 py-1 rounded-lg text-[10px] font-bold" onclick="godDelMsg('${m.id}','messages')">Delete</button></div></div>`).join('')||'<div class="text-center text-xs text-gray-400 py-6">No direct messages found</div>';
};

window.godDeleteUser=async function(id){
  if(!isGod())return;
  const p=profileById(id);
  if(!confirm(`Permanently erase user @${p.username}?`))return;
  await deleteDoc(dref('profiles',id));
  toast("User erased from reality");
  godFilterUsers();
};

window.godEditUser=async function(id){
  if(!isGod())return;
  const p=profileById(id);
  const n=prompt("Set new identity name (silent):",p.username);
  if(!n||!n.trim())return;
  await updateDoc(dref('profiles',id),{username:n.trim()});
  toast("Identity rewritten silently");
  godFilterUsers();
};

window.godRenderRooms=function(){
  const box=document.getElementById('god-room-list');if(!box)return;
  box.innerHTML=rooms.map(r=>`<div class="glass-soft p-2.5 rounded-xl flex items-center gap-2">
    <div class="flex-1 min-w-0"><b class="text-xs truncate block">${esc(r.name)}</b><span class="text-[9px] text-gray-400">${r.private?'Private':'Public'}</span></div>
    <button class="primary px-2.5 py-1 rounded-lg text-[10px] font-bold" onclick="godJoinRoomSilently('${r.id}')"><i class="fas fa-eye-slash mr-1"></i> Infiltrate</button>
    <button class="danger-outline px-2 py-1 rounded-lg text-[10px] font-bold" onclick="deleteRoom('${r.id}')"><i class="fas fa-trash"></i></button>
  </div>`).join('')||'<div class="text-center text-xs text-gray-400">No rooms</div>';
};

window.godJoinRoomSilently=async function(roomId){
  if(!isGod())return;
  const r=rooms.find(x=>x.id===roomId);if(!r)return;
  const gid=activeProfile.id;
  const hidden=[...new Set([...(r.hiddenMembers||[]),gid])];
  await updateDoc(dref('rooms',roomId),{members:arrayUnion(gid),hiddenMembers:hidden});
  toast("Silently infiltrated room");
  closeModal();
  enterRoom(roomId);
};

window.openGodUserPosts=function(userId){
  if(!isGod())return;
  const u=profileById(userId);
  const uPosts=posts.filter(p=>p.authorId===userId);
  modal(`<div class="space-y-3">
    <div class="flex items-center gap-3"><button class="icon-btn" onclick="openGodConsole()">←</button><h2 class="text-lg font-extrabold">Posts by ${esc(u.username)}</h2></div>
    <div class="space-y-2 max-h-96 overflow-auto">${uPosts.map(p=>`<div class="glass-soft p-3 rounded-xl"><div class="text-xs">${esc(p.description||'[Media Post]')}</div><div class="flex gap-2 mt-2"><button class="secondary px-2.5 py-1 rounded-lg text-[10px] font-bold" onclick="godEditPostSilent('${p.id}')">Edit (No trace)</button><button class="danger-outline px-2.5 py-1 rounded-lg text-[10px] font-bold" onclick="godDeletePost('${p.id}','${userId}')">Delete</button></div></div>`).join('')||'<div class="text-center text-xs text-gray-400 py-6">No posts</div>'}</div>
  </div>`);
};

window.godEditPostSilent=function(postId){
  const p=posts.find(x=>x.id===postId);if(!p)return;
  modal(`<div class="space-y-3"><h2 class="text-lg font-extrabold">Silent Post Edit</h2><p class="text-xs text-gray-500">Edit without leaving any trace.</p><textarea id="god-post-desc" class="field min-h-28">${esc(p.description||'')}</textarea><button class="primary w-full py-2.5 rounded-xl font-bold text-xs" onclick="godSavePostSilent('${postId}')">Rewrite Reality</button></div>`);
};

window.godSavePostSilent=async function(postId){
  const desc=document.getElementById('god-post-desc').value.trim();
  await updateDoc(dref('posts',postId),{description:desc});
  closeModal();
  toast("Post edited without a trace");
};

window.godDeletePost=async function(postId,userId){
  await deleteDoc(dref('posts',postId));
  toast("Post erased");
  openGodUserPosts(userId);
};

window.godEditMsg=async function(id,colName,curText){
  const t=prompt("Rewrite message text silently:",curText);
  if(t===null)return;
  await updateDoc(dref(colName,id),{text:t.trim()});
  toast("Message rewritten");
  if(document.getElementById('god-msg-list')) godRenderAllMessagesInline();
};

window.godDelMsg=async function(id,colName){
  await deleteDoc(dref(colName,id));
  toast("Message deleted");
  if(document.getElementById('god-msg-list')) godRenderAllMessagesInline();
};
</script>
</body>
