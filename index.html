window.joinRoom=async id=>{const r=rooms.find(x=>x.id===id);if(!r)return;if(r.private){toast("This is a private room. Ask a moderator to add you.",false);return}await updateDoc(dref("rooms",id),{members:arrayUnion(activeProfile.id)});toast("Joined room");enterRoom(id)};
window.openRoomDetails=id=>{const r=rooms.find(x=>x.id===id);if(!r)return;const members=r.members||[r.createdBy],mods=r.moderators||[r.createdBy],mine=r.createdBy===activeProfile.id||mods.includes(activeProfile.id);modal(`<div class="flex items-center gap-3"><div class="avatar w-14 h-14 rounded-2xl"><i class="fas fa-${r.private?'lock':'hashtag'}"></i></div><div><h2 class="text-xl font-extrabold">${esc(r.name)}</h2><div class="text-xs text-gray-500">${members.length} members · ${mods.length} moderator${mods.length===1?'':'s'}</div></div></div><p class="text-sm text-gray-600 mt-4">${esc(r.description||'No room description yet.')}</p><div class="mt-4"><b class="text-xs uppercase tracking-wider">Members</b><div class="space-y-2 mt-2 max-h-48 overflow-auto">${members.map(id=>{const p=profileById(id);return `<div class="glass-soft rounded-xl p-2 flex items-center gap-2">${avatar(p,'w-8 h-8')}<span class="text-xs flex-1">${esc(p.username)}${mods.includes(id)?' · moderator':''}</span>${mine&&id!==activeProfile.id?`<button class="text-[9px] text-indigo-600 font-bold" onclick="promoteRoomMod('${id}','${id}')">Make mod</button>`:''}</div>`}).join('')}</div></div><div class="flex gap-2 mt-4"><button class="primary flex-1 py-3 rounded-2xl font-bold" onclick="closeModal();${members.includes(activeProfile.id)?`enterRoom('${id}')`:`joinRoom('${id}')`}">${members.includes(activeProfile.id)?'Open room':'Join room'}</button>${members.includes(activeProfile.id)?`<button class="secondary px-4 rounded-2xl" onclick="openRoomChat('${id}')"><i class="fas fa-comments"></i></button>`:''}${mine?`<button class="secondary px-4 rounded-2xl" onclick="editRoom('${id}')"><i class="fas fa-pen"></i></button>`:''}</div>`);
window.editRoom=id=>{const r=rooms.find(x=>x.id===id);if(!r)return;closeModal();modal(`<h2 class="text-xl font-extrabold">Room settings</h2><input id="room-edit-name" class="field mt-4" value="${esc(r.name)}"><textarea id="room-edit-desc" class="field mt-2 min-h-24">${esc(r.description||'')}</textarea><label class="flex items-center gap-2 text-xs font-bold mt-3"><input id="room-private" type="checkbox" ${r.private?'checked':''}> Private room</label><button class="primary w-full py-3 rounded-2xl mt-4 font-bold" onclick="saveRoom('${id}')">Save</button>${r.createdBy===activeProfile.id?`<button class="danger-outline w-full py-3 rounded-2xl mt-2 font-bold" onclick="deleteRoom('${id}')"><i class="fas fa-trash mr-1"></i> Delete room</button>`:''}`)};
window.saveRoom=async id=>{await updateDoc(dref("rooms",id),{name:document.getElementById('room-edit-name').value.trim(),description:document.getElementById('room-edit-desc').value.trim(),private:document.getElementById('room-private').checked});closeModal();toast('Room updated')};
window.deleteRoom=async id=>{const r=rooms.find(x=>x.id===id);if(!r||r.createdBy!==activeProfile.id){toast('Only the room creator can delete this room',false);return}if(!confirm(`Delete the room "${r.name}"? This cannot be undone.`))return;try{await deleteDoc(dref('rooms',id));if(currentRoomId===id){currentRoomId='global';switchView('feed')}closeModal();toast('Room deleted')}catch(e){console.error(e);toast('Could not delete room',false)}};
window.promoteRoomMod=async(userId,roomId)=>{const r=rooms.find(x=>x.id===roomId);if(!r)return;await updateDoc(dref('rooms',roomId),{moderators:arrayUnion(userId)});toast('Moderator added');openRoomDetails(roomId)};
window.searchRooms=()=>{modal(`<h2 class="text-xl font-extrabold">Search rooms</h2><input id="room-search" class="field mt-4" placeholder="Search room name…" oninput="renderRoomSearch()"><div id="room-search-results" class="space-y-2 mt-3"></div>`);renderRoomSearch()};
window.renderRoomSearch=()=>{const q=(document.getElementById('room-search')?.value||'').toLowerCase();const f=rooms.filter(r=>r.name.toLowerCase().includes(q));document.getElementById('room-search-results').innerHTML=f.map(r=>`<button class="glass-soft w-full p-3 rounded-2xl text-left" onclick="closeModal();openRoomDetails('${r.id}')"><b>${esc(r.name)}</b><div class="text-[10px] text-gray-500">${esc(r.description||'Karuthu room')}</div></button>`).join('')||'<div class="text-xs text-gray-400 text-center py-6">No rooms found.</div>'};

window.reportPost=async id=>{const reason=prompt('Why are you reporting this post?')||'Unspecified';await addDoc(col('reports'),{kind:'post',targetId:id,reporterId:activeProfile.id,reason,status:'open',createdAt:Date.now()});toast('Post reported');closeModal()};
window.reportUser=async id=>{const reason=prompt('Why are you reporting this user?')||'Unspecified';await addDoc(col('reports'),{kind:'user',targetId:id,reporterId:activeProfile.id,reason,status:'open',createdAt:Date.now()});toast('User reported');closeModal()};
window.blockUser=async id=>{await updateDoc(dref('profiles',activeProfile.id),{blocked:arrayUnion(id)});toast('User blocked');closeModal()};
window.muteUser=async id=>{await updateDoc(dref('profiles',activeProfile.id),{muted:arrayUnion(id)});toast('User muted');closeModal()};
window.openSafetyMenu=id=>modal(`<h3 class="text-xl font-extrabold">Safety controls</h3><button class="secondary w-full py-3 rounded-2xl mt-4" onclick="reportUser('${id}')">Report user</button><button class="secondary w-full py-3 rounded-2xl mt-2" onclick="muteUser('${id}')">Mute user</button><button class="w-full py-3 rounded-2xl mt-2 bg-rose-50 text-rose-600 font-bold" onclick="blockUser('${id}')">Block user</button>`);

// Add report/safety actions to every post's owner menu without breaking the original menu.
const _postMenu=window.postMenu;window.postMenu=id=>{const p=posts.find(x=>x.id===id);if(!p)return;modal(`<h3 class="text-xl font-extrabold">Post options</h3>${p.authorId===activeProfile.id?`<button class="secondary w-full py-3 rounded-2xl mt-4" onclick="editPost('${id}')">Edit post</button><button class="w-full py-3 rounded-2xl mt-2 bg-rose-50 text-rose-600 font-bold" onclick="deletePost('${id}')">Delete post</button>`:''}<button class="secondary w-full py-3 rounded-2xl mt-2" onclick="reportPost('${id}')">Report post</button>`)};

window.openStories=async()=>{const s=(await getDocsSafe('stories')).filter(x=>x.expiresAt>Date.now());modal(`<div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Stories</h2><label class="primary px-3 py-2 rounded-xl text-xs font-bold cursor-pointer">Add story<input id="story-file" type="file" accept="image/*,video/*" class="hidden"></label></div><div class="story-strip mt-5">${s.map(x=>{const p=profileById(x.authorId);return `<button class="story-bubble" onclick="viewStory('${x.id}')"><div class="story-ring"><div class="story-inner">${x.mediaType==='video'?'<i class="fas fa-play text-indigo-500"></i>':`<img src="${esc(x.mediaUrl)}" class="w-full h-full object-cover">`}</div></div><div class="text-[10px] font-bold mt-1 truncate">${esc(p.username)}</div></button>`}).join('')||'<div class="text-xs text-gray-400 py-8">No active stories yet.</div>'}</div>`);document.getElementById('story-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const storyRef=ref(storage,`stories/${activeProfile.id}/${uid()}${f.type.startsWith('video')?'.mp4':'.jpg'}`);await uploadBytes(storyRef,f,{contentType:f.type});const url=await getDownloadURL(storyRef);await addDoc(col('stories'),{authorId:activeProfile.id,mediaUrl:url,mediaType:f.type.startsWith('video')?'video':'image',createdAt:Date.now(),expiresAt:Date.now()+86400000});toast('Story added');openStories()}};
async function getDocsSafe(name){return new Promise(resolve=>{const u=onSnapshot(col(name),s=>{u();resolve(s.docs.map(x=>({id:x.id,...x.data()})))},{includeMetadataChanges:false})})}
window.viewStory=async id=>{const all=await getDocsSafe('stories'),x=all.find(a=>a.id===id);if(!x)return;modal(`<div class="text-center"><div class="text-xs text-gray-400 mb-3">${esc(profileById(x.authorId).username)} · Story</div>${x.mediaType==='video'?`<video src="${esc(x.mediaUrl)}" controls autoplay class="w-full max-h-[70vh] rounded-2xl"></video>`:`<img src="${esc(x.mediaUrl)}" class="w-full max-h-[70vh] object-contain rounded-2xl">`}</div>`);

window.openReels=async()=>{const reels=await getDocsSafe('reels');modal(`<div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Reels</h2><label class="primary px-3 py-2 rounded-xl text-xs font-bold cursor-pointer">Upload reel<input id="reel-file" type="file" accept="video/*" class="hidden"></label></div><div class="grid grid-cols-2 gap-3 mt-5">${reels.map(r=>`<button class="relative" onclick="viewReel('${r.id}')"><video src="${esc(r.videoUrl)}" class="reel-thumb w-full"></video><span class="absolute bottom-2 left-2 right-2 text-white text-[10px] font-bold text-left drop-shadow">${esc(r.caption||'Karuthu reel')}</span></button>`).join('')||'<div class="col-span-2 text-xs text-gray-400 text-center py-8">No reels yet.</div>'}</div>`);document.getElementById('reel-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=ref(storage,`reels/${activeProfile.id}/${uid()}.mp4`);await uploadBytes(r,f,{contentType:f.type});const url=await getDownloadURL(r);await addDoc(col('reels'),{authorId:activeProfile.id,videoUrl:url,caption:'New Karuthu reel',createdAt:Date.now()});toast('Reel uploaded');openReels()}};
window.viewReel=async id=>{const all=await getDocsSafe('reels'),r=all.find(x=>x.id===id);if(!r)return;modal(`<video src="${esc(r.videoUrl)}" controls autoplay class="w-full max-h-[75vh] rounded-2xl"></video><div class="text-sm font-bold mt-3">${esc(r.caption||'Karuthu reel')}</div>`);

window.togglePin=async(postId,roomId)=>{const r=rooms.find(x=>x.id===roomId);if(!r)return;const pins=[...(r.pinnedPosts||[])],i=pins.indexOf(postId);i>=0?pins.splice(i,1):pins.push(postId);await updateDoc(dref('rooms',roomId),{pinnedPosts:pins});closeModal();toast(i>=0?'Post unpinned':'Post pinned')};
window.openRoomChat=async roomId=>{const r=rooms.find(x=>x.id===roomId);if(!r)return;closeModal();modal(`<div class="flex items-center gap-3 border-b border-white/60 pb-3"><div class="avatar w-10 h-10 rounded-2xl"><i class="fas fa-hashtag"></i></div><div class="flex-1"><b>${esc(r.name)} chat</b><div class="text-[10px] text-gray-500">Room-specific chat</div></div><button class="icon-btn" onclick="closeModal()">×</button></div><div id="room-chat-box" class="max-h-[55dvh] overflow-auto py-3 space-y-2"></div><div class="flex gap-2 mt-2"><input id="room-chat-input" class="field py-2.5" placeholder="Message the room…"><button class="primary w-11 rounded-2xl" onclick="sendRoomChat('${roomId}')"><i class="fas fa-paper-plane text-xs"></i></button></div>`);const render=()=>onSnapshot(col('roomMessages'),s=>{const box=document.getElementById('room-chat-box');if(!box)return;const list=s.docs.map(x=>({id:x.id,...x.data()})).filter(m=>m.roomId===roomId).sort((a,b)=>a.createdAt-b.createdAt);box.innerHTML=list.map(m=>`<div class="flex ${m.authorId===activeProfile.id?'justify-end':'justify-start'}"><div class="${m.authorId===activeProfile.id?'primary':'glass-soft'} max-w-[80%] rounded-2xl px-3 py-2 text-xs"><b>${esc(profileById(m.authorId).username)}</b><div>${esc(m.text)}</div><div class="text-[8px] opacity-60 text-right mt-1">${new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="text-center text-xs text-gray-400 py-10">Start the room conversation.</div>';box.scrollTop=box.scrollHeight});render()};
window.sendRoomChat=async roomId=>{const i=document.getElementById('room-chat-input'),text=i.value.trim();if(!text)return;await addDoc(col('roomMessages'),{roomId,authorId:activeProfile.id,text,createdAt:Date.now()});i.value='';recordActivity('room_chat',`${activeProfile.username} posted in ${rooms.find(r=>r.id===roomId)?.name||'a room'}`,{roomId})};

function aiSummary(text){const clean=(text||'').replace(/\s+/g,' ').trim();if(!clean)return 'No text content to summarize.';const words=clean.split(' ');return words.length<=28?clean:words.slice(0,28).join(' ')+'…';}
function aiTags(text){const stop=new Set(['this','that','with','from','your','have','about','will','into','they','what','when','then','were','been','just','like','the','and','for','you']);return [...new Set((text||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>4&&!stop.has(w)))].slice(0,6)}
window.aiAssistPost=()=>{const text=document.getElementById('post-desc')?.value||'';const tags=aiTags(text);modal(`<h2 class="text-xl font-extrabold">AI writing assist</h2><p class="text-xs text-gray-500 mt-1">Local demo assistant — no external AI API key required.</p><div class="glass-soft rounded-2xl p-3 mt-4"><b class="text-xs">Suggested summary</b><p class="text-sm mt-2">${esc(aiSummary(text))}</p></div><div class="glass-soft rounded-2xl p-3 mt-3"><b class="text-xs">Suggested hashtags</b><div class="flex flex-wrap gap-2 mt-2">${tags.map(t=>`<button class="secondary px-2 py-1 rounded-full text-[10px]" onclick="addSuggestedTag('${t}')">#${t}</button>`).join('')||'<span class="text-xs text-gray-400">Write a post first.</span>'}</div></div>`);
window.addSuggestedTag=t=>{const i=document.getElementById('post-tags');if(i)i.value=[...new Set((i.value.split(',').map(x=>x.trim()).filter(Boolean)).concat(t))].join(', ');toast('Hashtag added')};
window.openAISearch=()=>modal(`<h2 class="text-xl font-extrabold">AI content search</h2><p class="text-xs text-gray-500 mt-1">Describe what you are looking for in natural language.</p><input id="ai-query" class="field mt-4" placeholder="e.g. posts about robotics with fire reactions"><button class="primary w-full py-3 rounded-2xl mt-3 font-bold" onclick="runAISearch()">Search Karuthu</button><div id="ai-results" class="space-y-2 mt-4"></div>`);
window.runAISearch=()=>{const q=(document.getElementById('ai-query').value||'').toLowerCase();const terms=q.split(/\s+/).filter(x=>x.length>3&&!['posts','about','with','that','from'].includes(x));const found=posts.filter(p=>{const hay=((p.description||'')+' '+(p.hashtags||[]).join(' ')).toLowerCase();return !terms.length||terms.some(t=>hay.includes(t))}).slice(0,12);document.getElementById('ai-results').innerHTML=found.map(p=>`<button class="glass-soft w-full p-3 rounded-2xl text-left" onclick="closeModal();currentRoomId='${p.roomId||'global'}';switchView('feed');setTimeout(()=>document.getElementById('post-${p.id}')?.scrollIntoView({behavior:'smooth'}),250)"><b class="text-xs">${esc(profileById(p.authorId).username)}</b><div class="text-xs mt-1">${esc(aiSummary(p.description||'Media post'))}</div></button>`).join('')||'<div class="text-xs text-gray-400 text-center py-6">No matching posts.</div>'};

window.openActivity=()=>{modal(`<h2 class="text-xl font-extrabold">Real-time activity</h2><div id="activity-list" class="space-y-2 mt-4"></div>`);onSnapshot(col('activity'),s=>{const list=s.docs.map(x=>({id:x.id,...x.data()})).filter(a=>a.createdAt>Date.now()-86400000).sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);const el=document.getElementById('activity-list');if(el)el.innerHTML=list.map(a=>`<div class="glass-soft rounded-2xl p-3"><div class="text-xs font-semibold">${esc(a.text)}</div><div class="text-[9px] text-gray-400 mt-1">${new Date(a.createdAt).toLocaleTimeString()}</div></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-8">No recent activity.</div>'})};

window.openLeaderboard=()=>{const score=p=>(p.followers||[]).length*3+posts.filter(x=>x.authorId===p.id).length+posts.filter(x=>x.authorId===p.id).reduce((a,x)=>a+Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0),0);const list=[...profiles].sort((a,b)=>score(b)-score(a)).slice(0,20);modal(`<h2 class="text-xl font-extrabold">Leaderboard</h2><p class="text-xs text-gray-500 mt-1">Community engagement points.</p><div class="space-y-2 mt-4">${list.map((p,i)=>`<div class="glass-soft rounded-2xl p-3 flex items-center gap-3"><b class="w-6 text-center">${i+1}</b>${avatar(p,'w-9 h-9')}<span class="flex-1 text-sm font-bold">${esc(p.username)} ${verifiedMark(p)}</span><span class="text-xs font-extrabold text-indigo-600">${score(p)} pts</span></div>`).join('')}</div>`);

function getAchievements(p){const mine=posts.filter(x=>x.authorId===p.id),reactions=mine.reduce((a,x)=>a+Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0),0),out=[];if(mine.length>=1)out.push(['First Post','fa-feather']);if(mine.length>=5)out.push(['Creator','fa-pen-nib']);if(reactions>=10)out.push(['Community Spark','fa-fire']);if((p.followers||[]).length>=10)out.push(['Connector','fa-users']);if((p.following||[]).length>=10)out.push(['Explorer','fa-compass']);if(p.verified)out.push(['Verified','fa-circle-check']);return out}
window.openAchievements=()=>{const a=getAchievements(activeProfile);modal(`<h2 class="text-xl font-extrabold">Achievements</h2><div class="space-y-2 mt-4">${a.map(x=>`<div class="glass-soft rounded-2xl p-3 flex items-center gap-3"><div class="avatar w-10 h-10 rounded-xl"><i class="fas ${x[1]}"></i></div><b class="text-sm">${x[0]}</b><span class="text-[9px] text-emerald-600 ml-auto">Unlocked</span></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-8">Keep participating to unlock badges.</div>'}</div>`);

window.openAnalytics=()=>{const mine=posts.filter(p=>p.authorId===activeProfile.id),reac=mine.reduce((a,x)=>a+Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0),0),comments=mine.reduce((a,x)=>a+(x.comments||[]).length,0),media=mine.filter(x=>(x.mediaUrls||[]).length).length;modal(`<h2 class="text-xl font-extrabold">My post analytics</h2><div class="grid grid-cols-2 gap-3 mt-4"><div class="metric"><div class="text-[10px] text-gray-500">Posts</div><b class="text-2xl">${mine.length}</b></div><div class="metric"><div class="text-[10px] text-gray-500">Reactions</div><b class="text-2xl">${reac}</b></div><div class="metric"><div class="text-[10px] text-gray-500">Comments</div><b class="text-2xl">${comments}</b></div><div class="metric"><div class="text-[10px] text-gray-500">Media posts</div><b class="text-2xl">${media}</b></div></div><div class="glass-soft rounded-2xl p-4 mt-4"><b class="text-sm">Top posts</b><div class="space-y-2 mt-3">${mine.sort((a,b)=>{const rr=x=>Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0);return rr(b)-rr(a)}).slice(0,5).map(p=>`<div class="text-xs flex gap-2"><span class="flex-1 truncate">${esc(aiSummary(p.description||'Media post'))}</span><b>${Object.values(p.reactions||{}).reduce((s,v)=>s+(v||[]).length,0)} ❤️</b></div>`).join('')||'<span class="text-xs text-gray-400">No posts yet.</span>'}</div></div>`);

window.openAdminDashboard=async()=>{if(!isAdmin()){toast('Admin access required',false);return}const reports=await getDocsSafe('reports');modal(`<h2 class="text-xl font-extrabold">Admin moderation dashboard</h2><div class="flex gap-2 mt-4"><span class="secondary px-3 py-2 rounded-xl text-xs">${reports.filter(r=>r.status==='open').length} open reports</span><span class="secondary px-3 py-2 rounded-xl text-xs">${profiles.length} users</span><span class="secondary px-3 py-2 rounded-xl text-xs">${posts.length} posts</span></div><div class="space-y-2 mt-4">${reports.filter(r=>r.status==='open').map(r=>`<div class="glass-soft rounded-2xl p-3"><div class="text-xs font-bold">${esc(r.kind)} report · ${esc(r.reason)}</div><div class="text-[9px] text-gray-400 mt-1">Target: ${esc(r.targetId)}</div><div class="flex gap-2 mt-2"><button class="secondary px-3 py-1.5 rounded-lg text-[10px]" onclick="resolveReport('${r.id}')">Resolve</button>${r.kind==='post'?`<button class="text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg text-[10px] font-bold" onclick="moderateDeletePost('${r.targetId}','${r.id}')">Remove post</button>`:''}</div></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-8">No open reports.</div>'}</div>`);
window.resolveReport=async id=>{await updateDoc(dref('reports',id),{status:'resolved',resolvedBy:activeProfile.id,resolvedAt:Date.now()});toast('Report resolved');openAdminDashboard()};
window.moderateDeletePost=async(pid,rid)=>{await deleteDoc(dref('posts',pid));await updateDoc(dref('reports',rid),{status:'resolved',resolvedBy:activeProfile.id,resolvedAt:Date.now(),action:'post_removed'});toast('Post removed');openAdminDashboard()};

// Verification: admins can toggle the badge from a user's profile modal.
const _openProfile=window.openProfile;window.openProfile=id=>{const p=profileById(id),mine=id===activeProfile.id,following=(activeProfile.following||[]).includes(id);const minePosts=posts.filter(x=>x.authorId===id).sort((a,b)=>b.createdAt-a.createdAt);const saved=mine?posts.filter(x=>(activeProfile.savedPosts||[]).includes(x.id)):[];const mediaPosts=minePosts.filter(x=>(x.mediaUrls||[]).length||x.mediaUrl);const grid=list=>list.slice(0,18).map(x=>{const src=(x.mediaUrls||[])[0]||x.mediaUrl;return `<button class="profile-grid-item" onclick="closeModal();currentRoomId='${x.roomId||'global'}';switchView('feed');setTimeout(()=>document.getElementById('post-${x.id}')?.scrollIntoView({behavior:'smooth',block:'center'}),250)">${src?`<img src="${esc(src)}" alt="">`:`<div class="profile-grid-text">${esc((x.description||'').slice(0,90))}</div>`}${x.mediaType==='video'?'<span class="grid-video"><i class="fas fa-play"></i></span>':''}</button>`}).join('')||'<div class="profile-empty">No posts yet.</div>';modal(`<div class="ig-profile"><div class="ig-profile-head"><div class="ig-profile-avatar">${avatar(p,'w-28 h-28 md:w-32 md:h-32')}</div><div class="ig-profile-info"><div class="flex items-center gap-2 flex-wrap"><h2 class="ig-profile-name">${esc(p.username)} ${verifiedMark(p)}</h2></div><p class="ig-bio">${esc(p.bio||'No bio yet.')}</p><div class="ig-stats"><span><b>${minePosts.length}</b><small>posts</small></span><span><b>${(p.followers||[]).length}</b><small>followers</small></span><span><b>${(p.following||[]).length}</b><small>following</small></span></div><div class="flex gap-2 mt-4">${mine?`<button class="secondary flex-1 py-2.5 rounded-xl font-bold" onclick="editProfile()">Edit profile</button><button class="secondary px-4 rounded-xl" onclick="logoutNexus()"><i class="fas fa-right-from-bracket"></i></button>`:`<button class="${following?'secondary':'primary'} flex-1 py-2.5 rounded-xl font-bold" onclick="toggleFollow('${id}');closeModal()">${following?'Following':'Follow'}</button><button class="secondary px-4 rounded-xl" onclick="openSafetyMenu('${id}')"><i class="fas fa-ellipsis"></i></button>`}</div></div></div><div class="ig-tabs"><button class="ig-tab active" onclick="showProfileTab('posts')"><i class="fas fa-table-cells"></i><span>POSTS</span></button><button class="ig-tab" onclick="showProfileTab('media')"><i class="fas fa-photo-film"></i><span>MEDIA</span></button>${mine?`<button class="ig-tab" onclick="showProfileTab('saved')"><i class="far fa-bookmark"></i><span>SAVED</span></button>`:''}</div><div id="profile-tab-content" class="profile-grid">${grid(minePosts)}</div>${mine?`<div class="profile-account-actions"><button class="secondary" onclick="editProfile()"><i class="fas fa-gear"></i> Account settings</button><button class="danger-outline" onclick="deleteProfile()"><i class="fas fa-trash"></i> Delete profile</button></div>`:''}</div>`);
window.showProfileTab=tab=>{const box=document.getElementById('profile-tab-content');if(!box)return;document.querySelectorAll('.ig-tab').forEach(b=>b.classList.remove('active'));const active=[...document.querySelectorAll('.ig-tab')][tab==='posts'?0:tab==='media'?1:2];active?.classList.add('active');const id=activeProfile.id;const minePosts=posts.filter(x=>x.authorId===id).sort((a,b)=>b.createdAt-a.createdAt);const list=tab==='media'?minePosts.filter(x=>(x.mediaUrls||[]).length||x.mediaUrl):tab==='saved'?posts.filter(x=>(activeProfile.savedPosts||[]).includes(x.id)):minePosts;box.innerHTML=list.slice(0,18).map(x=>{const src=(x.mediaUrls||[])[0]||x.mediaUrl;return `<button class="profile-grid-item" onclick="closeModal();currentRoomId='${x.roomId||'global'}';switchView('feed');setTimeout(()=>document.getElementById('post-${x.id}')?.scrollIntoView({behavior:'smooth',block:'center'}),250)">${src?`<img src="${esc(src)}" alt="">`:`<div class="profile-grid-text">${esc((x.description||'').slice(0,90))}</div>`}</button>`}).join('')||'<div class="profile-empty">Nothing here yet.</div>'};
window.toggleVerification=async(id,state)=>{await updateDoc(dref('profiles',id),{verified:!state});toast(state?'Verification removed':'User verified');openProfile(id)};

// Room search button injected into room header.
const roomHeader=document.querySelector('#rooms .glass.card');if(roomHeader){const b=document.createElement('button');b.className='secondary px-3 py-2 rounded-xl text-xs font-bold mt-2';b.innerHTML='<i class="fas fa-magnifying-glass mr-1"></i> Search rooms';b.onclick=()=>window.searchRooms();roomHeader.appendChild(b)}
// AI assistant button in composer.
const publishBtn=document.getElementById('publish-btn');if(publishBtn){const ai=document.createElement('button');ai.className='secondary flex-1 py-3 rounded-2xl font-bold';ai.innerHTML='<i class="fas fa-wand-magic-sparkles mr-1"></i> AI';ai.onclick=()=>window.aiAssistPost();publishBtn.parentElement.insertBefore(ai,publishBtn)}
// Activity hooks for the real-time feed.
const _createRoom=window.createRoom;window.createRoom=async()=>{await _createRoom();recordActivity('room',`${activeProfile.username} created a room`)};
const _toggleFollow=window.toggleFollow;window.toggleFollow=async id=>{const before=(activeProfile.following||[]).includes(id);await _toggleFollow(id);if(!before)recordActivity('follow',`${activeProfile.username} followed ${profileById(id).username}`)};
</script>
</body>
</html>
