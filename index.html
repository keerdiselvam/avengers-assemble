<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karuthu — Social Space</title>
<script src="https://cdn.tailwindcss.com">

/* Nexus 31–52 feature pack */
const activityCache=[];
function recordActivity(type,text,extra={}){if(!activeProfile)return addDoc(col("activity"),{type,text,actorId:activeProfile.id,createdAt:Date.now(),...extra}).catch(()=>{})}
function verifiedMark(p){return p?.verified?'<span class="verified"><i class="fas fa-check"></i></span>':''}
function isAdmin(){return activeProfile?.role==="admin"}

window.openKaruthuTools=()=>modal(`<h2 class="text-xl font-extrabold">Karuthu Tools</h2><p class="text-xs text-gray-500 mt-1">Your creative and community toolkit.</p><div class="feature-grid mt-4">
<button class="feature-tile" onclick="closeModal();openStories()"><i class="fas fa-circle-play block"></i><b class="text-sm">Stories</b><div class="text-[10px] text-gray-500">24-hour photo/video cards</div></button>
<button class="feature-tile" onclick="closeModal();openReels()"><i class="fas fa-film block"></i><b class="text-sm">Reels</b><div class="text-[10px] text-gray-500">Short vertical videos</div></button>
<button class="feature-tile" onclick="closeModal();openActivity()"><i class="fas fa-bolt block"></i><b class="text-sm">Live activity</b><div class="text-[10px] text-gray-500">Real-time community events</div></button>
<button class="feature-tile" onclick="closeModal();openAnalytics()"><i class="fas fa-chart-line block"></i><b class="text-sm">My analytics</b><div class="text-[10px] text-gray-500">Posts, reactions & reach</div></button>
<button class="feature-tile" onclick="closeModal();openAchievements()"><i class="fas fa-medal block"></i><b class="text-sm">Achievements</b><div class="text-[10px] text-gray-500">Badges you can unlock</div></button>
<button class="feature-tile" onclick="closeModal();openLeaderboard()"><i class="fas fa-trophy block"></i><b class="text-sm">Leaderboard</b><div class="text-[10px] text-gray-500">Community rankings</div></button>
<button class="feature-tile" onclick="closeModal();openAISearch()"><i class="fas fa-wand-magic-sparkles block"></i><b class="text-sm">AI search</b><div class="text-[10px] text-gray-500">Natural-language post search</div></button>
<button class="feature-tile" onclick="closeModal();openAdminDashboard()"><i class="fas fa-shield-halved block"></i><b class="text-sm">Moderation</b><div class="text-[10px] text-gray-500">Admin reports & controls</div></button>
</div>`);

window.openAuroraTools=window.openKaruthuTools;
window.joinRoom=async id=>{const r=rooms.find(x=>x.id===id);if(!r)return;if(r.private){toast("This is a private room. Ask a moderator to add you.",false);return}await updateDoc(dref("rooms",id),{members:arrayUnion(activeProfile.id)});toast("Joined room");enterRoom(id)};
window.openRoomDetails=id=>{const r=rooms.find(x=>x.id===id);if(!r)return;const members=[...new Set(r.members||[r.createdBy])],mods=[...new Set(r.moderators||[r.createdBy])],head=profileById(r.createdBy),mine=r.createdBy===activeProfile.id||mods.includes(activeProfile.id);const memberRows=members.map(mid=>{const p=profileById(mid);return `<div class="glass-soft rounded-xl p-3 flex items-center gap-3">${avatar(p,'w-9 h-9')}<div class="flex-1 min-w-0"><b class="text-sm truncate block">${esc(p.username)}</b><div class="text-[11px] text-gray-500">${mid===r.createdBy?'Head of room':mods.includes(mid)?'Moderator':'Member'}</div></div>${mine&&mid!==activeProfile.id&&mid!==r.createdBy&&!mods.includes(mid)?`<button class="text-xs text-teal-700 font-bold" onclick="promoteRoomMod('${mid}','${id}')">Make moderator</button>`:''}</div>`}).join('');modal(`<div class="space-y-4"><div class="flex items-center gap-3"><div class="avatar w-14 h-14 rounded-2xl"><i class="fas fa-${r.private?'lock':'hashtag'}"></i></div><div class="min-w-0 flex-1"><h2 class="text-2xl font-extrabold truncate">${esc(r.name)}</h2><div class="text-sm text-gray-500">${members.length} members · ${mods.length} moderators</div></div></div><div class="room-head-panel"><div class="text-xs uppercase tracking-wider text-gray-500 font-bold">Head of room</div><div class="flex items-center gap-3 mt-2">${avatar(head,'w-11 h-11')}<div><b class="text-base">${esc(head.username)}</b><div class="text-xs text-gray-500">Room creator & head</div></div></div></div><div><div class="flex items-center justify-between"><b class="text-base">Room members</b><span class="text-xs text-gray-500">${members.length}</span></div><div class="space-y-2 mt-2 max-h-64 overflow-auto">${memberRows}</div></div><p class="text-sm text-gray-600">${esc(r.description||'No room description yet.')}</p><div class="flex gap-2 flex-wrap"><button class="primary flex-1 min-w-[150px] py-3 rounded-2xl font-bold" onclick="closeModal();${members.includes(activeProfile.id)?`enterRoom('${id}')`:`joinRoom('${id}')`}">${members.includes(activeProfile.id)?'Open room':'Join room'}</button>${members.includes(activeProfile.id)?`<button class="secondary px-4 rounded-2xl" onclick="openRoomChat('${id}')"><i class="fas fa-comments"></i></button>`:''}${mine?`<button class="secondary px-4 rounded-2xl" onclick="editRoom('${id}')"><i class="fas fa-pen"></i></button>`:''}${r.createdBy===activeProfile.id?`<button class="room-delete-visible px-4 rounded-2xl font-bold" onclick="deleteRoom('${id}')"><i class="fas fa-trash mr-1"></i>Delete room</button>`:''}</div></div>`);
window.editRoom=id=>{const r=rooms.find(x=>x.id===id);if(!r)return;closeModal();modal(`<h2 class="text-xl font-extrabold">Room settings</h2><input id="room-edit-name" class="field mt-4" value="${esc(r.name)}"><textarea id="room-edit-desc" class="field mt-2 min-h-24">${esc(r.description||'')}</textarea><label class="flex items-center gap-2 text-xs font-bold mt-3"><input id="room-private" type="checkbox" ${r.private?'checked':''}> Private room</label><button class="primary w-full py-3 rounded-2xl mt-4 font-bold" onclick="saveRoom('${id}')">Save</button>${r.createdBy===activeProfile.id?`<button class="danger-outline w-full py-3 rounded-2xl mt-2 font-bold" onclick="deleteRoom('${id}')"><i class="fas fa-trash mr-1"></i> Delete room</button>`:''}`)};
window.saveRoom=async id=>{await updateDoc(dref("rooms",id),{name:document.getElementById('room-edit-name').value.trim(),description:document.getElementById('room-edit-desc').value.trim(),private:document.getElementById('room-private').checked});closeModal();toast('Room updated')};
window.deleteRoom=async id=>{const r=rooms.find(x=>x.id===id);if(!r||r.createdBy!==activeProfile.id){toast('Only the room creator can delete this room',false);return}if(!confirm(`Delete the room "${r.name}"? This cannot be undone.`))return;try{await deleteDoc(dref('rooms',id));if(currentRoomId===id){currentRoomId='global';switchView('feed')}closeModal();toast('Room deleted')}catch(e){console.error(e);toast('Could not delete room',false)}};
window.promoteRoomMod=async(userId,roomId)=>{const r=rooms.find(x=>x.id===roomId);if(!r)return;await updateDoc(dref('rooms',roomId),{moderators:arrayUnion(userId)});toast('Moderator added');openRoomDetails(roomId)};
window.searchRooms=()=>{modal(`<h2 class="text-xl font-extrabold">Search rooms</h2><input id="room-search" class="field mt-4" placeholder="Search room name…" oninput="renderRoomSearch()"><div id="room-search-results" class="space-y-2 mt-3"></div>`);renderRoomSearch()};
window.renderRoomSearch=()=>{const q=(document.getElementById('room-search')?.value||'').toLowerCase();const f=rooms.filter(r=>r.name.toLowerCase().includes(q));document.getElementById('room-search-results').innerHTML=f.map(r=>`<button class="glass-soft w-full p-3 rounded-2xl text-left" onclick="closeModal();openRoomDetails('${r.id}')"><b>${esc(r.name)}</b><div class="text-[10px] text-gray-500">${esc(r.description||'Karuthu room')}</div></button>`).join('')||'<div class="text-xs text-gray-400 text-center py-6">No rooms found.</div>'};

window.reportPost=async id=>{const reason=prompt('Why are you reporting this post?')||'Unspecified';await addDoc(col('reports'),{kind:'post',targetId:id,reporterId:activeProfile.id,reason,status:'open',createdAt:Date.now()});toast('Post reported');closeModal()};
window.reportUser=async id=>{const reason=prompt('Why are you reporting this user?')||'Unspecified';await addDoc(col('reports'),{kind:'user',targetId:id,reporterId:activeProfile.id,reason,status:'open',createdAt:Date.now()});toast('User reported');closeModal()};
window.blockUser=async id=>{await updateDoc(dref('profiles',activeProfile.id),{blocked:arrayUnion(id)});toast('User blocked');closeModal()};
window.muteUser=async id=>{await updateDoc(dref('profiles',activeProfile.id),{muted:arrayUnion(id)});toast('User muted');closeModal()};
window.openSafetyMenu=id=>modal(`<h3 class="text-xl font-extrabold">Safety controls</h3><button class="secondary w-full py-3 rounded-2xl mt-4" onclick="reportUser('${id}')">Report user</button><button class="secondary w-full py-3 rounded-2xl mt-2" onclick="muteUser('${id}')">Mute user</button><button class="w-full py-3 rounded-2xl mt-2 bg-rose-50 text-rose-600 font-bold" onclick="blockUser('${id}')">Block user</button>`);

// Add report/safety actions to every post's owner menu without breaking the original menu.
const _postMenu=window.postMenu;window.postMenu=id=>{const p=posts.find(x=>x.id===id);if(!p)return;modal(`<h3 class="text-xl font-extrabold">Post options</h3>${p.authorId===activeProfile.id?`<button class="secondary w-full py-3 rounded-2xl mt-4" onclick="editPost('${id}')">Edit post</button><button class="w-full py-3 rounded-2xl mt-2 bg-rose-50 text-rose-600 font-bold" onclick="deletePost('${id}')">Delete post</button>`:''}<button class="secondary w-full py-3 rounded-2xl mt-2" onclick="reportPost('${id}')">Report post</button>`)};

window.openStories=async()=>{const s=(await getDocsSafe('stories')).filter(x=>x.expiresAt>Date.now());modal(`<div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Stories</h2><label class="primary px-3 py-2 rounded-xl text-xs font-bold cursor-pointer">Add story<input id="story-file" type="file" accept="image/*,video/*" class="hidden"></label></div><div class="story-strip mt-5">${s.map(x=>{const p=profileById(x.authorId);return `<button class="story-bubble" onclick="viewStory('${x.id}')"><div class="story-ring"><div class="story-inner">${x.mediaType==='video'?'<i class="fas fa-play text-indigo-500"></i>':`<img src="${esc(x.mediaUrl)}" class="w-full h-full object-cover">`}</div></div><div class="text-[10px] font-bold mt-1 truncate">${esc(p.username)}</div></button>`}).join('')||'<div class="text-xs text-gray-400 py-8">No active stories yet.</div>'}</div>`);document.getElementById('story-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const storyRef=ref(storage,`stories/${activeProfile.id}/${uid()}${f.type.startsWith('video')?'.mp4':'.jpg'}`);await uploadBytes(storyRef,f,{contentType:f.type});const url=await getDownloadURL(storyRef);await addDoc(col('stories'),{authorId:activeProfile.id,mediaUrl:url,mediaType:f.type.startsWith('video')?'video':'image',createdAt:Date.now(),expiresAt:Date.now()+86400000});toast('Story added');openStories()}};
async function getDocsSafe(name){return new Promise(resolve=>{const u=onSnapshot(col(name),s=>{u();resolve(s.docs.map(x=>({id:x.id,...x.data()})))},{includeMetadataChanges:false})})}
window.viewStory=async id=>{const all=await getDocsSafe('stories'),x=all.find(a=>a.id===id);if(!x)return;modal(`<div class="text-center"><div class="text-xs text-gray-400 mb-3">${esc(profileById(x.authorId).username)} · Story</div>${x.mediaType==='video'?`<video src="${esc(x.mediaUrl)}" controls autoplay class="w-full max-h-[70vh] rounded-2xl"></video>`:`<img src="${esc(x.mediaUrl)}" class="w-full max-h-[70vh] object-contain rounded-2xl">`}</div>`);

window.openReels=async()=>{const reels=await getDocsSafe('reels');modal(`<div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Reels</h2><label class="primary px-3 py-2 rounded-xl text-xs font-bold cursor-pointer">Upload reel<input id="reel-file" type="file" accept="video/*" class="hidden"></label></div><div class="grid grid-cols-2 gap-3 mt-5">${reels.map(r=>`<button class="relative" onclick="viewReel('${r.id}')"><video src="${esc(r.videoUrl)}" class="reel-thumb w-full"></video><span class="absolute bottom-2 left-2 right-2 text-white text-[10px] font-bold text-left drop-shadow">${esc(r.caption||'Karuthu reel')}</span></button>`).join('')||'<div class="col-span-2 text-xs text-gray-400 text-center py-8">No reels yet.</div>'}</div>`);document.getElementById('reel-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=ref(storage,`reels/${activeProfile.id}/${uid()}.mp4`);await uploadBytes(r,f,{contentType:f.type});const url=await getDownloadURL(r);await addDoc(col('reels'),{authorId:activeProfile.id,videoUrl:url,caption:'New Karuthu reel',createdAt:Date.now()});toast('Reel uploaded');openReels()}};
window.viewReel=async id=>{const all=await getDocsSafe('reels'),r=all.find(x=>x.id===id);if(!r)return;modal(`<video src="${esc(r.videoUrl)}" controls autoplay class="w-full max-h-[75vh] rounded-2xl"></video><div class="text-sm font-bold mt-3">${esc(r.caption||'Karuthu reel')}</div>`);

window.togglePin=async(postId,roomId)=>{const r=rooms.find(x=>x.id===roomId);if(!r)return;const pins=[...(r.pinnedPosts||[])],i=pins.indexOf(postId);i>=0?pins.splice(i,1):pins.push(postId);await updateDoc(dref('rooms',roomId),{pinnedPosts:pins});closeModal();toast(i>=0?'Post unpinned':'Post pinned')};
window.openRoomChat=async roomId=>{const r=rooms.find(x=>x.id===roomId);if(!r)return;closeModal();modal(`<div class="flex items-center gap-3 border-b border-white/60 pb-3"><div class="avatar w-10 h-10 rounded-2xl"><i class="fas fa-hashtag"></i></div><div class="flex-1"><b>${esc(r.name)} chat</b><div class="text-[10px] text-gray-500">Room-specific chat</div></div><button class="icon-btn" onclick="closeModal()">×</button></div><div id="room-chat-box" class="max-h-[55dvh] overflow-auto py-3 space-y-2"></div><div class="flex gap-2 mt-2"><input id="room-chat-input" class="field py-2.5" placeholder="Message the room…"><button class="primary w-11 rounded-2xl" onclick="sendRoomChat('${roomId}')"><i class="fas fa-paper-plane text-xs"></i></button></div>`);const render=()=>onSnapshot(col('roomMessages'),s=>{const box=document.getElementById('room-chat-box');if(!box)return;const list=s.docs.map(x=>({id:x.id,...x.data()})).filter(m=>m.roomId===roomId).sort((a,b)=>a.createdAt-b.createdAt);box.innerHTML=list.map(m=>`<div class="flex ${m.authorId===activeProfile.id?'justify-end':'justify-start'}"><div class="${m.authorId===activeProfile.id?'primary':'glass-soft'} max-w-[80%] rounded-2xl px-3 py-2 text-xs"><b>${esc(profileById(m.authorId).username)}</b><div>${esc(m.text)}</div><div class="text-[8px] opacity-60 text-right mt-1">${new Date(m.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="text-center text-xs text-gray-400 py-10">Start the room conversation.</div>';box.scrollTop=box.scrollHeight});render()};
window.sendRoomChat=async roomId=>{const i=document.getElementById('room-chat-input'),text=i.value.trim();if(!text)return;await addDoc(col('roomMessages'),{roomId,authorId:activeProfile.id,text,createdAt:Date.now()});i.value='';recordActivity('room_chat',`${activeProfile.username} posted in ${rooms.find(r=>r.id===roomId)?.name||'a room'}`,{roomId})};

function aiSummary(text){const clean=(text||'').replace(/\s+/g,' ').trim();if(!clean)return 'No text content to summarize.';const words=clean.split(' ');return words.length<=28?clean:words.slice(0,28).join(' ')+'…';}
function aiTags(text){const stop=new Set(['this','that','with','from','your','have','about','will','into','they','what','when','then','were','been','just','like','the','and','for','you']);return [...new Set((text||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>4&&!stop.has(w)))].slice(0,6)}
window.aiAssistPost=()=>{const text=document.getElementById('post-desc')?.value||'';const tags=aiTags(text);modal(`<h2 class="text-xl font-extrabold">AI writing assist</h2><p class="text-xs text-gray-500 mt-1">Local demo assistant — no external AI API key required.</p><div class="glass-soft rounded-2xl p-3 mt-4"><b class="text-xs">Suggested summary</b><p class="text-sm mt-2">${esc(aiSummary(text))}</p></div><div class="glass-soft rounded-2xl p-3 mt-3"><b class="text-xs">Suggested hashtags</b><div class="flex flex-wrap gap-2 mt-2">${tags.map(t=>`<button class="secondary px-2 py-1 rounded-full text-[10px]" onclick="addSuggestedTag('${t}')">#${t}</button>`).join('')||'<span class="text-xs text-gray-400">Write a post first.</span>'}</div></div>`);
window.addSuggestedTag=t=>{const i=document.getElementById('post-tags');if(i)i.value=[...new Set((i.value.split(',').map(x=>x.trim()).filter(Boolean)).concat(t))].join(', ');toast('Hashtag added')};
window.openAISearch=()=>modal(`<h2 class="text-xl font-extrabold">AI content search</h2><p class="text-xs text-gray-500 mt-1">Describe what you are looking for in natural language.</p><input id="ai-query" class="field mt-4" placeholder="e.g. posts about robotics with fire reactions"><button class="primary w-full py-3 rounded-2xl mt-3 font-bold" onclick="runAISearch()">Search Karuthu</button><div id="ai-results" class="space-y-2 mt-4"></div>`);
window.runAISearch=()=>{const q=(document.getElementById('ai-query').value||'').toLowerCase();const terms=q.split(/\s+/).filter(x=>x.length>3&&!['posts','about','with','that','from'].includes(x));const found=posts.filter(p=>{const hay=((p.description||'')+' '+(p.hashtags||[]).join(' ')).toLowerCase();return !terms.length||terms.some(t=>hay.includes(t))}).slice(0,12);document.getElementById('ai-results').innerHTML=found.map(p=>`<button class="glass-soft w-full p-3 rounded-2xl text-left" onclick="closeModal();currentRoomId='${p.roomId||'global'}';switchView('feed');setTimeout(()=>document.getElementById('post-${p.id}')?.scrollIntoView({behavior:'smooth'}),250)"><b class="text-xs">${esc(profileById(p.authorId).username)}</b><div class="text-xs mt-1">${esc(aiSummary(p.description||'Media post'))}</div></button>`).join('')||'<div class="text-xs text-gray-400 text-center py-6">No matching posts.</div>'};

window.openActivity=()=>{modal(`<h2 class="text-xl font-extrabold">Real-time activity</h2><div id="activity-list" class="space-y-2 mt-4"></div>`);onSnapshot(col('activity'),s=>{const list=s.docs.map(x=>({id:x.id,...x.data()})).filter(a=>a.createdAt>Date.now()-86400000).sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);const el=document.getElementById('activity-list');if(el)el.innerHTML=list.map(a=>`<div class="glass-soft rounded-2xl p-3"><div class="text-xs font-semibold">${esc(a.text)}</div><div class="text-[9px] text-gray-400 mt-1">${new Date(a.createdAt).toLocaleTimeString()}</div></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-8">No recent activity.</div>'})};

window.openLeaderboard=()=>{const score=p=>(p.followers||[]).length*3+posts.filter(x=>x.authorId===p.id).length+posts.filter(x=>x.authorId===p.id).reduce((a,x)=>a+Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0),0);const list=[...profiles].sort((a,b)=>score(b)-score(a)).slice(0,20);modal(`<h2 class="text-xl font-extrabold">Leaderboard</h2><p class="text-xs text-gray-500 mt-1">Community engagement points.</p><div class="space-y-2 mt-4">${list.map((p,i)=>`<div class="glass-soft rounded-2xl p-3 flex items-center gap-3"><b class="w-6 text-center">${i+1}</b>${avatar(p,'w-9 h-9')}<span class="flex-1 text-sm font-bold">${esc(p.username)} ${verifiedMark(p)}</span><span class="text-xs font-extrabold text-indigo-600">${score(p)} pts</span></div>`).join('')}</div>`);

function getAchievements(p){const mine=posts.filter(x=>x.authorId===p.id),reactions=mine.reduce((a,x)=>a+Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0),0),out=[];if(mine.length>=1)out.push(['First Post','fa-feather']);if(mine.length>=5)out.push(['Creator','fa-pen-nib']);if(reactions>=10)out.push(['Community Spark','fa-fire']);if((p.followers||[]).length>=10)out.push(['Connector','fa-users']);if((p.following||[]).length>=10)out.push(['Explorer','fa-compass']);if(p.verified)out.push(['Verified','fa-circle-check']);return out}
window.openAchievements=()=>{const a=getAchievements(activeProfile);modal(`<h2 class="text-xl font-extrabold">Achievements</h2><div class="space-y-2 mt-4">${a.map(x=>`<div class="glass-soft rounded-2xl p-3 flex items-center gap-3"><div class="avatar w-10 h-10 rounded-xl"><i class="fas ${x[1]}"></i></div><b class="text-sm">${x[0]}</b><span class="text-[9px] text-emerald-600 ml-auto">Unlocked</span></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-8">Keep participating to unlock badges.</div>'}</div>`);

window.openAnalytics=()=>{const mine=posts.filter(p=>p.authorId===activeProfile.id),reac=mine.reduce((a,x)=>a+Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0),0),comments=mine.reduce((a,x)=>a+(x.comments||[]).length,0),media=mine.filter(x=>(x.mediaUrls||[]).length).length;modal(`<h2 class="text-xl font-extrabold">My post analytics</h2><div class="grid grid-cols-2 gap-3 mt-4"><div class="metric"><div class="text-[10px] text-gray-500">Posts</div><b class="text-2xl">${mine.length}</b></div><div class="metric"><div class="text-[10px] text-gray-500">Reactions</div><b class="text-2xl">${reac}</b></div><div class="metric"><div class="text-[10px] text-gray-500">Comments</div><b class="text-2xl">${comments}</b></div><div class="metric"><div class="text-[10px] text-gray-500">Media posts</div><b class="text-2xl">${media}</b></div></div><div class="glass-soft rounded-2xl p-4 mt-4"><b class="text-sm">Top posts</b><div class="space-y-2 mt-3">${mine.sort((a,b)=>{const rr=x=>Object.values(x.reactions||{}).reduce((s,v)=>s+(v||[]).length,0);return rr(b)-rr(a)}).slice(0,5).map(p=>`<div class="text-xs flex gap-2"><span class="flex-1 truncate">${esc(aiSummary(p.description||'Media post'))}</span><b>${Object.values(p.reactions||{}).reduce((s,v)=>s+(v||[]).length,0)} ❤️</b></div>`).join('')||'<span class="text-xs text-gray-400">No posts yet.</span>'}</div></div>`);

window.openAdminDashboard=async()=>{if(!isAdmin()){toast('Admin access required',false);return}const reports=await getDocsSafe('reports');modal(`<h2 class="text-xl font-extrabold">Admin moderation dashboard</h2><div class="flex gap-2 mt-4"><span class="secondary px-3 py-2 rounded-xl text-xs">${reports.filter(r=>r.status==='open').length} open reports</span><span class="secondary px-3 py-2 rounded-xl text-xs">${profiles.length} users</span><span class="secondary px-3 py-2 rounded-xl text-xs">${posts.length} posts</span></div><div class="space-y-2 mt-4">${reports.filter(r=>r.status==='open').map(r=>`<div class="glass-soft rounded-2xl p-3"><div class="text-xs font-bold">${esc(r.kind)} report · ${esc(r.reason)}</div><div class="text-[9px] text-gray-400 mt-1">Target: ${esc(r.targetId)}</div><div class="flex gap-2 mt-2"><button class="secondary px-3 py-1.5 rounded-lg text-[10px]" onclick="resolveReport('${r.id}')">Resolve</button>${r.kind==='post'?`<button class="text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg text-[10px] font-bold" onclick="moderateDeletePost('${r.targetId}','${r.id}')">Remove post</button>`:''}</div></div>`).join('')||'<div class="text-xs text-gray-400 text-center py-8">No open reports.</div>'}</div>`);
window.resolveReport=async id=>{await updateDoc(dref('reports',id),{status:'resolved',resolvedBy:activeProfile.id,resolvedAt:Date.now()});toast('Report resolved');openAdminDashboard()};
window.moderateDeletePost=async(pid,rid)=>{await deleteDoc(dref('posts',pid));await updateDoc(dref('reports',rid),{status:'resolved',resolvedBy:activeProfile.id,resolvedAt:Date.now(),action:'post_removed'});toast('Post removed');openAdminDashboard()};

// Verification: admins can toggle the badge from a user's profile modal.
const _openProfile=window.openProfile;window.openMyProfile=()=>{if(!activeProfile){toast("Please enter Karuthu first",false);return}openProfile(activeProfile.id)};
window.openProfile=id=>{const p=profileById(id),mine=id===activeProfile.id,following=(activeProfile.following||[]).includes(id);const minePosts=posts.filter(x=>x.authorId===id).sort((a,b)=>b.createdAt-a.createdAt);const saved=mine?posts.filter(x=>(activeProfile.savedPosts||[]).includes(x.id)):[];const mediaPosts=minePosts.filter(x=>(x.mediaUrls||[]).length||x.mediaUrl);const grid=list=>list.slice(0,18).map(x=>{const src=(x.mediaUrls||[])[0]||x.mediaUrl;return `<button class="profile-grid-item" onclick="closeModal();currentRoomId='${x.roomId||'global'}';switchView('feed');setTimeout(()=>document.getElementById('post-${x.id}')?.scrollIntoView({behavior:'smooth',block:'center'}),250)">${src?`<img src="${esc(src)}" alt="">`:`<div class="profile-grid-text">${esc((x.description||'').slice(0,90))}</div>`}${x.mediaType==='video'?'<span class="grid-video"><i class="fas fa-play"></i></span>':''}</button>`}).join('')||'<div class="profile-empty">No posts yet.</div>';modal(`<div class="ig-profile"><div class="ig-profile-head"><div class="ig-profile-avatar">${avatar(p,'w-28 h-28 md:w-32 md:h-32')}</div><div class="ig-profile-info"><div class="flex items-center gap-2 flex-wrap"><h2 class="ig-profile-name">${esc(p.username)} ${verifiedMark(p)}</h2></div><p class="ig-bio">${esc(p.bio||'No bio yet.')}</p><div class="ig-stats"><span><b>${minePosts.length}</b><small>posts</small></span><span><b>${(p.followers||[]).length}</b><small>followers</small></span><span><b>${(p.following||[]).length}</b><small>following</small></span></div><div class="flex gap-2 mt-4">${mine?`<button class="secondary flex-1 py-2.5 rounded-xl font-bold" onclick="editProfile()">Edit profile</button><button class="secondary px-4 rounded-xl" onclick="logoutNexus()"><i class="fas fa-right-from-bracket"></i></button>`:`<button class="${following?'secondary':'primary'} flex-1 py-2.5 rounded-xl font-bold" onclick="toggleFollow('${id}');closeModal()">${following?'Following':'Follow'}</button><button class="secondary px-4 rounded-xl" onclick="openSafetyMenu('${id}')"><i class="fas fa-ellipsis"></i></button>`}</div></div></div><div class="ig-tabs"><button class="ig-tab active" onclick="showProfileTab('posts')"><i class="fas fa-table-cells"></i><span>POSTS</span></button><button class="ig-tab" onclick="showProfileTab('media')"><i class="fas fa-photo-film"></i><span>MEDIA</span></button>${mine?`<button class="ig-tab" onclick="showProfileTab('saved')"><i class="far fa-bookmark"></i><span>SAVED</span></button>`:''}</div><div id="profile-tab-content" class="profile-grid">${grid(minePosts)}</div>${mine?`<div class="profile-account-actions"><button class="secondary" onclick="editProfile()"><i class="fas fa-gear"></i> Account settings</button><button class="danger-outline" onclick="deleteProfile()"><i class="fas fa-trash"></i> Delete profile</button></div>`:''}</div>`);
window.showProfileTab=tab=>{const box=document.getElementById('profile-tab-content');if(!box)return;document.querySelectorAll('.ig-tab').forEach(b=>b.classList.remove('active'));const active=[...document.querySelectorAll('.ig-tab')][tab==='posts'?0:tab==='media'?1:2];active?.classList.add('active');const id=activeProfile.id;const minePosts=posts.filter(x=>x.authorId===id).sort((a,b)=>b.createdAt-a.createdAt);const list=tab==='media'?minePosts.filter(x=>(x.mediaUrls||[]).length||x.mediaUrl):tab==='saved'?posts.filter(x=>(activeProfile.savedPosts||[]).includes(x.id)):minePosts;box.innerHTML=list.slice(0,18).map(x=>{const src=(x.mediaUrls||[])[0]||x.mediaUrl;return `<button class="profile-grid-item" onclick="closeModal();currentRoomId='${x.roomId||'global'}';switchView('feed');setTimeout(()=>document.getElementById('post-${x.id}')?.scrollIntoView({behavior:'smooth',block:'center'}),250)">${src?`<img src="${esc(src)}" alt="">`:`<div class="profile-grid-text">${esc((x.description||'').slice(0,90))}</div>`}</button>`}).join('')||'<div class="profile-empty">Nothing here yet.</div>'};
window.toggleVerification=async(id,state)=>{await updateDoc(dref('profiles',id),{verified:!state});toast(state?'Verification removed':'User verified');openProfile(id)};

// Room search button injected into room header.
const roomHeader=document.querySelector('#rooms .glass.card');if(roomHeader){const b=document.createElement('button');b.className='secondary px-3 py-2 rounded-xl text-xs font-bold mt-2';b.innerHTML='<i class="fas fa-magnifying-glass mr-1"></i> Search rooms';b.onclick=()=>window.searchRooms();roomHeader.appendChild(b)}
// AI assistant button in composer.
const publishBtn=document.getElementById('publish-btn');if(publishBtn){const ai=document.createElement('button');ai.className='secondary flex-1 py-3 rounded-2xl font-bold';ai.innerHTML='<i class="fas fa-wand-magic-sparkles mr-1"></i> AI';ai.onclick=()=>window.aiAssistPost();publishBtn.parentElement.insertBefore(ai,publishBtn)}
// Activity hooks for the real-time feed.
const _createRoom=window.createRoom;window.createRoom=async()=>{await _createRoom();recordActivity('room',`${activeProfile.username} created a room`)};
const _toggleFollow=window.toggleFollow;window.toggleFollow=async id=>{const before=(activeProfile.following||[]).includes(id);await _toggleFollow(id);if(!before)recordActivity('follow',`${activeProfile.username} followed ${profileById(id).username}`)};
</script>

const firebaseConfig={apiKey:"AIzaSyCJaDrE-Ex9DxyV6Hw_-5NAQk3XY4lPTvY",authDomain:"avengers-assemble-b97f5.firebaseapp.com",projectId:"avengers-assemble-b97f5",storageBucket:"avengers-assemble-b97f5.firebasestorage.app",messagingSenderId:"1055143035893",appId:"1:1055143035893:web:77673867994d3941c396bc"};
const APP="sih-mock-app-html"; let app,auth,db,storage,currentUser=null,activeProfile=null,currentView="login",currentRoomId="global";

async function compress(file,max=1200,q=.72){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=e=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w*=k;h*=k}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);c.toBlob(b=>b?res(b):rej(new Error("compress failed")),"image/jpeg",q)};im.src=e.target.result};rd.readAsDataURL(file)})}
async function uploadImage(file,path){const blob=await compress(file);const r=ref(storage,path);await uploadBytes(r,blob,{contentType:"image/jpeg"});return await getDownloadURL(r)}
async function compressImageBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=e=>{const img=new Image();img.onerror=reject;img.onload=()=>{const MAX_DIM=700;let w=img.width,h=img.height;if(Math.max(w,h)>MAX_DIM){const k=MAX_DIM/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL("image/jpeg",.6))};img.src=e.target.result};reader.readAsDataURL(file)})}
function getChatId(a,b){return [a,b].sort().join("_")}

let authReadyResolve;const authReady=new Promise(resolve=>{authReadyResolve=resolve});

document.getElementById("login-form").addEventListener("submit",async e=>{e.preventDefault();const input=document.getElementById("login-input"),btn=e.submitter||document.querySelector("#login-form button[type=submit]"),raw=input.value.trim(),id=raw.toLowerCase().replace(/[^a-z0-9_]/g,"");const err=document.getElementById("login-error");if(!id){err.textContent="Please enter a username.";err.classList.remove("hidden");return}err.classList.add("hidden");if(btn){btn.disabled=true;btn.dataset.originalText=btn.innerHTML;btn.innerHTML='Entering Karuthu <i class="fas fa-spinner fa-spin ml-1"></i>'}try{if(!currentUser)currentUser=await Promise.race([authReady,new Promise(r=>setTimeout(()=>r(null),8000))]);if(!currentUser)throw new Error("Authentication is not ready");const s=await getDoc(dref("profiles",id));if(s.exists())activeProfile={id:s.id,...s.data()};else{activeProfile={id,username:raw,bio:"",profilePicUrl:"",following:[],followers:[],joinedAt:Date.now(),lastSeen:Date.now(),online:true};await setDoc(dref("profiles",id),activeProfile)}
document.getElementById("header").classList.remove("hidden");document.getElementById("nav").classList.remove("hidden");document.getElementById("control-center").classList.remove("hidden");updateHeader();subscribe();switchView("feed");toast("Welcome to Karuthu")}catch(error){console.error(error);const loginError=document.getElementById("login-error");loginError.textContent=error?.message||"Could not enter Karuthu. Please try again.";loginError.classList.remove("hidden");toast("Could not enter Karuthu",false)}finally{if(btn){btn.disabled=false;btn.innerHTML=btn.dataset.originalText||"Enter Karuthu <i class="fas fa-arrow-right ml-1"></i>"}}});

function updateHeader(){const el=document.getElementById("header-avatar");if(el){if(activeProfile.profilePicUrl)el.innerHTML=`<img src="${esc(activeProfile.profilePicUrl)}" class="avatar w-10 h-10">`;else el.innerHTML=esc((activeProfile.username||"?")[0].toUpperCase())}document.getElementById("header-user").textContent="@"+activeProfile.username}
function subscribe(){
unsubs.forEach(f=>f&&f());unsubs=[];

unsubs.push(onSnapshot(col("rooms"),s=>{rooms=s.docs.map(x=>({id:x.id,...x.data()}));renderRooms();updateRoomSelect()}));
unsubs.push(onSnapshot(col("messages"),s=>{messages=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.createdAt-b.createdAt);renderChatList();if(currentChatId)renderDM(currentChatId);updateMessageBadge()}));
unsubs.push(onSnapshot(col("notifications"),s=>{notifications=s.docs.map(x=>({id:x.id,...x.data()})).filter(n=>n.targetId===activeProfile?.id).sort((a,b)=>b.createdAt-a.createdAt);updateNotifBadge()}))
setDoc(dref("profiles",activeProfile.id),{online:true,lastSeen:Date.now()},{merge:true});
window.addEventListener("beforeunload",()=>{if(activeProfile)setDoc(dref("profiles",activeProfile.id),{online:false,lastSeen:Date.now()},{merge:true})})
}
function updateNotifBadge(){const n=notifications.filter(x=>!x.read).length,b=document.getElementById("notif-badge");b.textContent=n;b.classList.toggle("hidden",!n);const cb=document.getElementById("cc-notif-badge");if(cb){cb.textContent=n;cb.classList.toggle("hidden",!n)}}
function updateMessageBadge(){const n=messages.filter(m=>m.targetId===activeProfile?.id&&!m.read).length,b=document.getElementById("msg-badge");b.textContent=n;b.classList.toggle("hidden",!n);const cb=document.getElementById("cc-msg-badge");if(cb){cb.textContent=n;cb.classList.toggle("hidden",!n)}}

function updateRoomSelect(){const s=document.getElementById("post-room");if(s)s.value="global"}
function renderRooms(){document.getElementById("rooms-container").innerHTML=rooms.length?rooms.map(r=>{const members=[...new Set(r.members||[r.createdBy])],isMember=members.includes(activeProfile.id),isPrivate=!!r.private,isOwner=r.createdBy===activeProfile.id,head=profileById(r.createdBy),mods=r.moderators||[r.createdBy];return `<div class="glass card p-5 room-card"><div class="flex items-start gap-3"><div class="avatar w-12 h-12 rounded-2xl"><i class="fas fa-${isPrivate?'lock':'hashtag'}"></i></div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><b class="text-lg truncate">${esc(r.name)}</b>${isPrivate?'<span class="text-xs bg-amber-50 text-amber-700 px-2 py-1 rounded-full">Private</span>':''}</div><div class="text-sm text-gray-500 mt-1">${esc(r.description||'Topic-focused Karuthu space')}</div></div>${isOwner?`<button class="room-delete-visible w-10 h-10 rounded-xl" title="Delete room" onclick="deleteRoom('${r.id}')"><i class="fas fa-trash"></i></button>`:''}</div><div class="room-head-panel mt-4"><div class="flex items-center gap-3">${avatar(head,'w-10 h-10')}<div class="flex-1"><div class="text-xs uppercase tracking-wider text-gray-500 font-bold">Head of room</div><b class="text-sm">${esc(head.username)}</b></div><span class="text-sm font-bold">${members.length} members</span></div></div><div class="flex items-center justify-between mt-4"><div class="room-member-stack">${members.slice(0,6).map(mid=>{const mp=profileById(mid);return mp?.profilePicUrl?`<img src="${esc(mp.profilePicUrl)}" class="room-member-avatar" title="${esc(mp.username)}">`:`<span class="room-member-avatar" title="${esc(mp?.username||'Member')}">${esc((mp?.username||'?')[0].toUpperCase())}</span>`}).join('')}${members.length>6?`<span class="text-xs text-gray-500 ml-2">+${members.length-6}</span>`:''}</div><span class="text-xs text-gray-500">${mods.length} moderator${mods.length===1?'':'s'}</span></div><div class="flex gap-2 mt-4"><button class="primary flex-1 py-3 rounded-xl text-sm font-bold" onclick="${isMember?`enterRoom('${r.id}')`:`joinRoom('${r.id}')`}">${isMember?'Open room':'Join room'}</button><button class="secondary px-4 rounded-xl" onclick="openRoomDetails('${r.id}')"><i class="fas fa-users"></i></button></div></div>`}).join(""): '<div class="glass card p-10 text-center text-base text-gray-500">No rooms yet. Create the first one.</div>'}
window.createRoom=async()=>{const i=document.getElementById("new-room"),name=i.value.trim();if(!name)return;await addDoc(col("rooms"),{name,description:"An Karuthu community room",createdBy:activeProfile.id,members:[activeProfile.id],moderators:[activeProfile.id],private:false,pinnedPosts:[],createdAt:Date.now()});i.value="";toast("Room created")}
window.enterRoom=id=>{currentRoomId=id;document.getElementById("room-banner").classList.remove("hidden");document.getElementById("room-name").textContent=rooms.find(r=>r.id===id)?.name||"Room";switchView("feed")}
window.exitRoom=()=>{currentRoomId="global";document.getElementById("room-banner").classList.add("hidden");renderFeed()}

function renderFeed(){let list=posts.filter(p=>(p.roomId||"global")===currentRoomId);if(currentRoomId!=="global"){const room=rooms.find(r=>r.id===currentRoomId);const pins=room?.pinnedPosts||[];list.sort((a,b)=>Number(pins.includes(b.id))-Number(pins.includes(a.id))||(b.createdAt||0)-(a.createdAt||0))}document.getElementById("feed-container").innerHTML=list.length?list.map(renderPost).join(""):'<div class="glass card p-12 text-center"><div class="text-4xl mb-3">✦</div><b>No posts here yet</b><p class="text-xs text-gray-500 mt-1">Be the first to start the conversation.</p></div>'}
function renderPost(p){
const author=profileById(p.authorId),rs=p.reactions||{},total=Object.values(rs).reduce((a,v)=>a+(v||[]).length,0),myReaction=(rs["❤️"]||[]).includes(activeProfile.id)?"❤️":null;const comments=p.comments||[];const mine=p.authorId===activeProfile.id;
let media="";const urls=p.mediaUrls||(p.mediaUrl?[p.mediaUrl]:[]);const b64s=p.imageBase64s||(p.imageBase64?[p.imageBase64]:[]);const mediaItems=urls.length?urls:b64s;if(p.videoUrl)media=`<div class="mt-3 relative overflow-hidden rounded-[26px] bg-black"><video src="${esc(p.videoUrl)}" class="w-full max-h-[520px] object-contain" controls playsinline preload="metadata"></video><span class="absolute top-3 left-3 px-2 py-1 rounded-full bg-black/45 text-white text-[9px] font-bold backdrop-blur">VIDEO</span></div>`;else if(mediaItems.length)media=`<div class="mt-3 relative overflow-hidden rounded-[26px] bg-black"><div class="carousel" id="car-${p.id}">${mediaItems.map(u=>`<div><img src="${esc(u)}" class="w-full max-h-[460px] object-contain" loading="lazy"></div>`).join("")}</div>${mediaItems.length>1?`<div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">${mediaItems.map((_,i)=>`<span class="dot ${i===0?"active":""}"></span>`).join("")}</div>`:""}</div>`;
let poll="";if(p.poll){const totalVotes=Object.values(p.poll.votes||{}).reduce((a,v)=>a+(v||[]).length,0);poll=`<div class="glass-soft rounded-2xl p-3 mt-3"><b>${esc(p.poll.question)}</b><div class="space-y-2 mt-3">${p.poll.options.map((o,i)=>{const voters=p.poll.votes?.[i]||[];const pct=totalVotes?Math.round(voters.length/totalVotes*100):0;const chosen=voters.includes(activeProfile.id);return `<button onclick="votePoll('${p.id}',${i})" class="w-full text-left rounded-xl p-2.5 relative overflow-hidden ${chosen?"ring-2 ring-indigo-400":""}"><span class="absolute inset-y-0 left-0 bg-indigo-100/70" style="width:${pct}%"></span><span class="relative flex justify-between text-xs font-semibold"><span>${esc(o)}</span><span>${pct}%</span></span></button>`}).join("")}</div><div class="text-[10px] text-gray-500 mt-2">${totalVotes} vote${totalVotes===1?"":"s"}</div></div>`}
const reactionButtons=Object.entries(rs).map(([r,arr])=>arr?.length?`<button onclick="react('${p.id}','${r}')" class="text-xs ${arr.includes(activeProfile.id)?"bg-indigo-100":"bg-gray-100"} px-2 py-1 rounded-full">${r} ${arr.length}</button>`:"").join("");
const commentsHtml=comments.map(c=>renderComment(c,p.id,0)).join("");
return `<article class="glass card p-4" id="post-${p.id}">
<div class="flex items-center gap-3">${avatar(author,"w-10 h-10")}<button class="text-left flex-1" onclick="openProfile('${author.id}')"><b class="text-sm">${esc(author.username)}</b><div class="text-[10px] text-gray-500">${new Date(p.createdAt).toLocaleString()}</div></button><button class="icon-btn" onclick="postMenu('${p.id}')"><i class="fas fa-ellipsis"></i></button></div>
${p.description?`<p class="mt-3 text-[14px] leading-6 whitespace-pre-wrap">${esc(p.description)}</p>`:""}${p.hashtags?.length?`<div class="flex flex-wrap gap-1.5 mt-2">${p.hashtags.map(t=>`<span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-full">#${esc(t)}</span>`).join("")}</div>`:""}${media}${poll}
<div class="flex items-center gap-2 mt-4 pt-3 border-t border-white/60"><div class="flex items-center gap-1"><button class="icon-btn reaction-heart ${myReaction==="❤️"?"is-liked":""}" onclick="react('${p.id}','❤️')" aria-label="Like"><i class="${myReaction==="❤️"?"fas":"far"} fa-heart"></i></button><button class="icon-btn !w-8 !h-8 !rounded-xl text-xs" onclick="toggleReactionMenu('${p.id}')" aria-label="More reactions"><i class="fas fa-face-smile"></i></button><div id="rm-${p.id}" class="reaction-menu glass hidden">${reactions.filter(r=>r!=="❤️").map(r=>`<button onclick="react('${p.id}','${r}');toggleReactionMenu('${p.id}')">${r}</button>`).join("")}</div></div><button class="text-xs font-bold text-gray-500 px-2" onclick="toggleComments('${p.id}')"><i class="far fa-comment mr-1"></i>${comments.length}</button><button class="text-xs font-bold text-gray-500 px-2" onclick="savePost('${p.id}')"><i class="${(activeProfile.savedPosts||[]).includes(p.id)?"fas":"far"} fa-bookmark mr-1"></i>${(activeProfile.savedPosts||[]).includes(p.id)?"Saved":"Save"}</button><button class="text-xs font-bold text-gray-500 px-2 ml-auto" onclick="sharePost('${p.id}')"><i class="fas fa-arrow-up-from-bracket mr-1"></i>Share</button></div>
<div class="flex flex-wrap gap-1.5 mt-2">${reactionButtons}</div>
<div id="comments-${p.id}" class="hidden mt-3 border-t border-white/60 pt-3"><div class="space-y-2 max-h-72 overflow-auto">${commentsHtml||'<div class="text-xs text-gray-400 text-center py-3">No comments yet.</div>'}</div><div class="flex gap-2 mt-3"><input id="comment-${p.id}" class="field py-2.5" placeholder="Write a comment..."><button class="primary w-11 rounded-2xl" onclick="addComment('${p.id}')"><i class="fas fa-paper-plane text-xs"></i></button></div></div>
</article>`}
function renderComment(c,pid,depth){const mine=c.authorId===activeProfile.id;return `<div class="ml-${Math.min(depth*4,12)} glass-soft rounded-xl p-2.5" style="margin-left:${Math.min(depth*18,54)}px"><div class="flex gap-2">${avatar(profileById(c.authorId),"w-7 h-7")}<div class="flex-1"><b class="text-[11px]">${esc(c.authorName||profileById(c.authorId).username)}</b><div class="text-xs mt-0.5">${esc(c.text)}</div><div class="flex gap-3 mt-1"><button class="text-[9px] text-gray-500" onclick="likeComment('${pid}','${c.id}')"><i class="${(c.likedBy||[]).includes(activeProfile.id)?"fas text-rose-500":"far"} fa-heart"></i> ${(c.likedBy||[]).length}</button><button class="text-[9px] text-gray-500" onclick="replyComment('${pid}','${c.id}')">Reply</button>${mine?`<button class="text-[9px] text-gray-500" onclick="editComment('${pid}','${c.id}')">Edit</button><button class="text-[9px] text-rose-500" onclick="deleteComment('${pid}','${c.id}')">Delete</button>`:""}</div></div></div>${(c.replies||[]).map(x=>renderComment(x,pid,depth+1)).join("")}</div>`}
window.toggleComments=id=>document.getElementById("comments-"+id).classList.toggle("hidden");
window.toggleReactionMenu=id=>document.getElementById("rm-"+id).classList.toggle("hidden");
window.react=async(pid,r)=>{const p=posts.find(x=>x.id===pid);if(!p)return;const data={...(p.reactions||{})};for(const key of reactions)data[key]=[...(data[key]||[])];const list=data[r]||[];data[r]=list.includes(activeProfile.id)?list.filter(x=>x!==activeProfile.id):[...list,activeProfile.id];await updateDoc(dref("posts",pid),{reactions:data});if(p.authorId!==activeProfile.id&&!list.includes(activeProfile.id))notify(p.authorId,"reaction",`${activeProfile.username} reacted ${r} to your post`,pid)}
window.savePost=async id=>{const saved=[...(activeProfile.savedPosts||[])];const i=saved.indexOf(id);i>=0?saved.splice(i,1):saved.push(id);activeProfile.savedPosts=saved;renderFeed();try{await updateDoc(dref("profiles",activeProfile.id),{savedPosts:saved});toast(i>=0?"Removed from saved":"Post saved")}catch(e){toast("Could not update saved posts",false)}}
window.sharePost=async id=>{const url=location.href.split("#")[0]+"#post-"+id;try{await navigator.clipboard.writeText(url);toast("Post link copied")}catch{toast("Could not copy link",false)}}
window.addComment=async pid=>{const i=document.getElementById("comment-"+pid),text=i.value.trim();if(!text)return;const p=posts.find(x=>x.id===pid);const c={id:uid(),authorId:activeProfile.id,authorName:activeProfile.username,text,likedBy:[],replies:[],createdAt:Date.now()};await updateDoc(dref("posts",pid),{comments:arrayUnion(c)});i.value="";if(p.authorId!==activeProfile.id)notify(p.authorId,"comment",`${activeProfile.username} commented on your post`,pid)}
window.replyComment=async(pid,cid)=>{const t=prompt("Reply:");if(!t?.trim())return;const p=posts.find(x=>x.id===pid),walk=a=>{for(const c of a){if(c.id===cid)return c;const r=walk(c.replies||[]);if(r)return r}};const target=walk(p.comments||[]);if(target){const reply={id:uid(),authorId:activeProfile.id,authorName:activeProfile.username,text:t.trim(),likedBy:[],replies:[],createdAt:Date.now()};target.replies=[...(target.replies||[]),reply];await updateDoc(dref("posts",pid),{comments:p.comments});notify(target.authorId,"reply",`${activeProfile.username} replied to your comment`,pid)}}
window.likeComment=async(pid,cid)=>{const p=posts.find(x=>x.id===pid);const walk=a=>{for(const c of a){if(c.id===cid)return c;const r=walk(c.replies||[]);if(r)return r}};const c=walk(p.comments||[]);if(!c)return;c.likedBy=c.likedBy||[];c.likedBy=c.likedBy.includes(activeProfile.id)?c.likedBy.filter(x=>x!==activeProfile.id):[...c.likedBy,activeProfile.id];await updateDoc(dref("posts",pid),{comments:p.comments})};
window.editComment=async(pid,cid)=>{const p=posts.find(x=>x.id===pid);const walk=a=>{for(const c of a){if(c.id===cid)return c;const r=walk(c.replies||[]);if(r)return r}};const c=walk(p.comments||[]);const t=prompt("Edit comment:",c?.text);if(c&&t?.trim()){c.text=t.trim();await updateDoc(dref("posts",pid),{comments:p.comments})}};
window.deleteComment=async(pid,cid)=>{if(!confirm("Delete this comment?"))return;const p=posts.find(x=>x.id===pid);const remove=a=>a.filter(c=>c.id!==cid).map(c=>({...c,replies:remove(c.replies||[])}));await updateDoc(dref("posts",pid),{comments:remove(p.comments||[])})};
window.votePoll=async(pid,i)=>{const p=posts.find(x=>x.id===pid),votes={...(p.poll.votes||{})};Object.keys(votes).forEach(k=>votes[k]=(votes[k]||[]).filter(x=>x!==activeProfile.id));votes[i]=[...(votes[i]||[]),activeProfile.id];await updateDoc(dref("posts",pid),{"poll.votes":votes})};

window.postMenu=id=>modal(`<h3 class="text-xl font-extrabold">Post options</h3><button class="secondary w-full py-3 rounded-2xl mt-4" onclick="editPost('${id}')">Edit post</button><button class="w-full py-3 rounded-2xl mt-2 bg-rose-50 text-rose-600 font-bold" onclick="deletePost('${id}')">Delete post</button>`)
window.editPost=id=>{closeModal();const p=posts.find(x=>x.id===id);modal(`<h3 class="text-xl font-extrabold">Edit post</h3><textarea id="edit-desc" class="field mt-4 min-h-28">${esc(p.description||"")}</textarea><input id="edit-tags" class="field mt-2" value="${esc((p.hashtags||[]).join(", "))}"><button class="primary w-full py-3 rounded-2xl mt-4 font-bold" onclick="savePostEdit('${id}')">Save changes</button>`)}
window.savePostEdit=async id=>{await updateDoc(dref("posts",id),{description:document.getElementById("edit-desc").value.trim(),hashtags:document.getElementById("edit-tags").value.split(",").map(x=>x.trim()).filter(Boolean)});closeModal();toast("Post updated")}
window.deletePost=async id=>{closeModal();if(!confirm("Delete this post?"))return;const p=posts.find(x=>x.id===id);for(const u of [...(p.mediaUrls||[]),p.videoUrl].filter(Boolean)){try{const path=u.split("/o/")[1]?.split("?")[0];if(path)await deleteObject(ref(storage,decodeURIComponent(path)))}catch{}}await deleteDoc(dref("posts",id));toast("Post deleted")}

let pollMode=false;window.togglePollBuilder=()=>{pollMode=!pollMode;document.getElementById("poll-builder").classList.toggle("hidden",!pollMode);if(pollMode&&!document.querySelector("#poll-options input")){addPollOption();addPollOption()}}
window.addPollOption=()=>{const d=document.getElementById("poll-options");if(d.children.length>=5)return;d.insertAdjacentHTML("beforeend",`<input class="field poll-opt" placeholder="Option ${d.children.length+1}">`)}
document.getElementById("media-input").addEventListener("change",e=>{const files=[...e.target.files];const videos=files.filter(f=>f.type.startsWith("video/"));if(videos.length){mediaFiles=[videos[0]];if(files.length>1)toast("A video post can contain one video",false)}else{mediaFiles=files.filter(f=>f.type.startsWith("image/")).slice(0,10);if(files.length>10)toast("Only the first 10 images were selected",false)}document.getElementById("media-previews").innerHTML=mediaFiles.map((f,i)=>f.type.startsWith("video/")?`<div class="relative col-span-2"><video src="${URL.createObjectURL(f)}" class="w-full h-36 object-cover rounded-2xl" muted></video><span class="absolute bottom-2 left-2 bg-black/60 text-white text-[9px] px-2 py-1 rounded-full">VIDEO</span><button class="absolute top-1 right-1 bg-black/60 text-white w-7 h-7 rounded-full" onclick="removeMedia(${i})">×</button></div>`:`<div class="relative"><img src="${URL.createObjectURL(f)}" class="w-full h-24 object-cover rounded-xl"><button class="absolute top-1 right-1 bg-black/60 text-white w-6 h-6 rounded-full" onclick="removeMedia(${i})">×</button></div>`).join("")})
window.removeMedia=i=>{mediaFiles.splice(i,1);document.getElementById("media-previews").innerHTML=mediaFiles.map((f,j)=>`<div class="relative"><img src="${URL.createObjectURL(f)}" class="w-full h-24 object-cover rounded-xl"><button class="absolute top-1 right-1 bg-black/60 text-white w-6 h-6 rounded-full" onclick="removeMedia(${j})">×</button></div>`).join("")}
window.publishPost=async()=>{const btn=document.getElementById("publish-btn"),desc=document.getElementById("post-desc").value.trim(),tags=document.getElementById("post-tags").value.split(",").map(x=>x.trim()).filter(Boolean);if(!desc&&!mediaFiles.length&&!pollMode)return;btn.disabled=true;btn.textContent="Publishing…";try{const imageBase64s=[];let videoUrl="";for(const file of mediaFiles){if(file.type.startsWith("video/")){if(file.size>50*1024*1024)throw Error("Video must be under 50 MB");const vr=ref(storage,`posts/${activeProfile.id}/${uid()}.mp4`);await uploadBytes(vr,file,{contentType:file.type});videoUrl=await getDownloadURL(vr)}else imageBase64s.push(await compressImageBase64(file))}let poll=null;if(pollMode){const opts=[...document.querySelectorAll(".poll-opt")].map(x=>x.value.trim()).filter(Boolean);if(opts.length<2)throw Error("Poll needs at least 2 options");poll={question:document.getElementById("poll-question").value.trim()||"Poll",options:opts,votes:{}}}await addDoc(col("posts"),{authorId:activeProfile.id,authorName:activeProfile.username,description:desc,hashtags:tags,imageBase64s,imageBase64:imageBase64s[0]||"",mediaUrls:[],videoUrl,likedBy:[],reactions:{},comments:[],roomId:"global",poll,createdAt:Date.now()});document.getElementById("post-desc").value="";document.getElementById("post-tags").value="";document.getElementById("poll-question").value="";document.getElementById("poll-options").innerHTML="";pollMode=false;document.getElementById("poll-builder").classList.add("hidden");mediaFiles=[];document.getElementById("media-input").value="";document.getElementById("media-previews").innerHTML="";toast("Published to Global Feed");switchView("feed")}catch(e){console.error(e);toast(e.message?.includes("50 MB")?e.message:(e.message?.includes("maximum")||e.message?.includes("size")?"Media is too large. Try a smaller file.":"Could not publish post"),false)}finally{btn.disabled=false;btn.textContent="Publish"}}
function renderNetwork(){if(!activeProfile)return;const following=activeProfile.following||[],followers=profiles.filter(p=>(p.following||[]).includes(activeProfile.id));document.getElementById("network-stats").textContent=`${following.length} following · ${followers.length} followers`;const others=profiles.filter(p=>p.id!==activeProfile.id);document.getElementById("network-container").innerHTML=others.map(p=>{const f=following.includes(p.id);return `<div class="glass card p-3 flex items-center gap-3">${avatar(p,"w-11 h-11")}<button class="flex-1 text-left" onclick="openProfile('${p.id}')"><b class="text-sm">${esc(p.username)}</b><div class="text-[10px] text-gray-500">${esc(p.bio||"Karuthu member")}</div></button><button class="${f?"secondary":"primary"} px-3 py-2 rounded-xl text-xs font-bold" onclick="toggleFollow('${p.id}')">${f?"Following":"Follow"}</button></div>`}).join("")}
window.toggleFollow=async id=>{const f=[...(activeProfile.following||[])],i=f.indexOf(id);i>=0?f.splice(i,1):f.push(id);await updateDoc(dref("profiles",activeProfile.id),{following:f});if(i<0){const target=profileById(id);await updateDoc(dref("profiles",id),{followers:arrayUnion(activeProfile.id)});notify(id,"follow",`${activeProfile.username} started following you`)}else await updateDoc(dref("profiles",id),{followers:arrayRemove(activeProfile.id)});toast(i<0?"Following":"Unfollowed")}

window.openProfile=id=>{const p=profileById(id),mine=id===activeProfile.id,following=(activeProfile.following||[]).includes(id);modal(`<div class="text-center">${avatar(p,"w-20 h-20 mx-auto")}<h2 class="text-2xl font-extrabold mt-3">${esc(p.username)}</h2><p class="text-sm text-gray-500 mt-1">${esc(p.bio||"No bio yet.")}</p><div class="flex justify-center gap-8 text-xs mt-4"><span><b>${(p.followers||[]).length}</b><br>Followers</span><span><b>${(p.following||[]).length}</b><br>Following</span></div>${mine?`<button class="primary w-full py-3 rounded-2xl mt-5 font-bold" onclick="editProfile()">Edit profile</button>`:`<button class="${following?"secondary":"primary"} w-full py-3 rounded-2xl mt-5 font-bold" onclick="toggleFollow('${id}');closeModal()">${following?"Following":"Follow"}</button>`}</div>`)}
window.editProfile=()=>{closeModal();modal(`<h2 class="text-xl font-extrabold">Edit profile</h2><div class="flex justify-center mt-4">${avatar(activeProfile,"w-24 h-24")}</div><input id="ep-name" class="field mt-4" value="${esc(activeProfile.username)}"><textarea id="ep-bio" class="field mt-2 min-h-24">${esc(activeProfile.bio||"")}</textarea><label class="secondary rounded-2xl p-3 flex items-center gap-2 mt-2 cursor-pointer text-xs font-bold"><i class="fas fa-camera"></i> Change profile picture<input id="ep-pic" type="file" accept="image/*" class="hidden"></label><button class="primary w-full py-3 rounded-2xl mt-4 font-bold" onclick="saveProfile()">Save profile</button><button class="secondary w-full py-3 rounded-2xl mt-2 font-bold" onclick="logoutNexus()"><i class="fas fa-right-from-bracket mr-1"></i> Log out</button><button class="w-full py-3 rounded-2xl mt-2 bg-rose-50 text-rose-600 font-bold" onclick="deleteProfile()"><i class="fas fa-trash mr-1"></i> Delete profile</button>`)}
window.saveProfile=async()=>{const name=document.getElementById("ep-name").value.trim().replace(/[^a-zA-Z0-9_ ]/g,""),bio=document.getElementById("ep-bio").value.trim(),pic=document.getElementById("ep-pic").files[0];if(!name)return;try{const changes={username:name,bio};if(pic)changes.profilePicUrl=await compressImageBase64(pic);await updateDoc(dref("profiles",activeProfile.id),changes);activeProfile={...activeProfile,...changes};updateHeader();closeModal();toast("Profile updated")}catch(e){console.error(e);toast("Could not update profile",false)}}
window.logoutNexus=async()=>{try{if(activeProfile)await updateDoc(dref("profiles",activeProfile.id),{online:false,lastSeen:Date.now()})}catch{}closeModal();unsubs.forEach(f=>f&&f());unsubs=[];activeProfile=null;document.getElementById("header").classList.add("hidden");document.getElementById("nav").classList.add("hidden");document.getElementById("control-center").classList.add("hidden");switchView("login");toast("Logged out")}
window.openAccountCenter=()=>{if(!activeProfile)return;modal(`<div class="space-y-3"><div><div class="text-xs font-bold text-teal-700 uppercase tracking-wider">Account</div><h2 class="text-2xl font-extrabold mt-1">Account control</h2><p class="text-sm text-gray-500 mt-1">Manage your Karuthu profile and session.</p></div><button class="secondary w-full py-3 rounded-2xl font-bold text-left" onclick="editProfile()"><i class="fas fa-pen mr-2"></i>Edit profile</button><button class="secondary w-full py-3 rounded-2xl font-bold text-left" onclick="logoutNexus()"><i class="fas fa-right-from-bracket mr-2"></i>Log out</button><button class="danger-outline w-full py-3 rounded-2xl font-bold text-left" onclick="deleteProfile()"><i class="fas fa-trash mr-2"></i>Delete my profile</button></div>`);
window.deleteProfile=async()=>{if(!activeProfile)return;if(!confirm("Delete your Karuthu profile? This removes your profile and any rooms you created. Existing posts may remain."))return;const id=activeProfile.id;try{for(const r of rooms.filter(x=>x.createdBy===id)){await deleteDoc(dref("rooms",r.id)).catch(()=>{})}await deleteDoc(dref("profiles",id));toast("Profile deleted");}catch(e){console.error(e);toast("Could not delete profile",false);return}closeModal();unsubs.forEach(f=>f&&f());unsubs=[];activeProfile=null;document.getElementById("header").classList.add("hidden");document.getElementById("nav").classList.add("hidden");document.getElementById("control-center").classList.add("hidden");switchView("login")}

window.openSearch=()=>{modal(`<h2 class="text-xl font-extrabold">Discover people</h2><input id="user-search" class="field mt-4" placeholder="Search username…" oninput="renderSearchResults()"><div id="search-results" class="space-y-2 mt-3"></div>`);renderSearchResults()}
window.renderSearchResults=()=>{const q=(document.getElementById("user-search")?.value||"").toLowerCase();const found=profiles.filter(p=>p.username.toLowerCase().includes(q)&&p.id!==activeProfile.id).slice(0,15);document.getElementById("search-results").innerHTML=found.map(p=>`<div class="glass-soft rounded-2xl p-3 flex items-center gap-3">${avatar(p,"w-10 h-10")}<button class="flex-1 text-left" onclick="closeModal();openProfile('${p.id}')"><b class="text-sm">${esc(p.username)}</b><div class="text-[10px] text-gray-500">${esc(p.bio||"Karuthu member")}</div></button><i class="fas fa-chevron-right text-gray-400"></i></div>`).join("")||'<div class="text-center text-xs text-gray-400 py-8">No users found.</div>'}
function suggestions(){return profiles.filter(p=>p.id!==activeProfile.id&&!(activeProfile.following||[]).includes(p.id)).sort((a,b)=>((b.followers||[]).length)-((a.followers||[]).length)).slice(0,3)}
function renderChatList(){const others=profiles.filter(p=>p.id!==activeProfile.id);document.getElementById("chat-list").innerHTML=(others.length?others:[]).map(p=>{const id=getChatId(activeProfile.id,p.id),msgs=messages.filter(m=>m.chatId===id);const last=msgs.at(-1);return `<button class="glass card w-full p-3 flex items-center gap-3 text-left" onclick="openDM('${p.id}')">${avatar(p,"w-11 h-11") }<span class="flex-1 min-w-0"><b class="text-sm">${esc(p.username)}</b><div class="text-[10px] text-gray-500 truncate">${esc(last?.text||"Start a conversation")}</div></span><span class="text-[9px] ${p.online?"text-emerald-500":"text-gray-400"}">${p.online?"● online":(p.lastSeen?"seen "+new Date(p.lastSeen).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"offline")}</span></button>`}).join("")}
window.openNewChat=openSearch;
window.openDM=id=>{dmTarget=profileById(id);currentChatId=getChatId(activeProfile.id,id);messages.filter(m=>m.chatId===currentChatId&&m.targetId===activeProfile.id&&!m.read).forEach(m=>updateDoc(dref("messages",m.id),{read:true}));modal(`<div class="flex items-center gap-3 border-b border-white/60 pb-3">${avatar(dmTarget,"w-10 h-10")}<div class="flex-1"><b>${esc(dmTarget.username)}</b><div class="text-[10px] ${dmTarget.online?"text-emerald-500":"text-gray-500"}">${dmTarget.online?"Online":"Offline"}</div></div><button class="icon-btn" onclick="closeModal()">×</button></div><div id="dm-messages" class="max-h-[55dvh] overflow-auto py-3 space-y-2"></div><div id="typing-line" class="text-[10px] text-gray-400 h-4"></div><div class="flex gap-2 mt-2"><button class="secondary w-11 rounded-2xl" onclick="insertChatEmoji()">😊</button><input id="dm-input" class="field py-2.5" placeholder="Message…" oninput="setTyping()"><button class="primary w-11 rounded-2xl" onclick="sendDM()"><i class="fas fa-paper-plane text-xs"></i></button></div>`);renderDM(currentChatId);onSnapshot(dref("typing",currentChatId),snap=>{const t=snap.data();const line=document.getElementById("typing-line");if(line&&t&&t.userId!==activeProfile.id&&t.typing)line.textContent=`${t.username||"Someone"} is typing…`;else if(line)line.textContent=""})}
function renderDM(chatId){const box=document.getElementById("dm-messages");if(!box)return;const list=messages.filter(m=>m.chatId===chatId);box.innerHTML=list.map(m=>`<div class="flex ${m.authorId===activeProfile.id?"justify-end":"justify-start"}"><div class="${m.authorId===activeProfile.id?"primary":"glass-soft"} max-w-[80%] rounded-2xl px-3 py-2 text-xs">${esc(m.text)}<div class="text-[8px] opacity-60 text-right mt-1">${new Date(m.createdAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div></div></div>`).join("")||'<div class="text-center text-xs text-gray-400 py-10">Say hello 👋</div>';box.scrollTop=box.scrollHeight}
window.sendDM=async()=>{const i=document.getElementById("dm-input"),text=i.value.trim();if(!text)return;await addDoc(col("messages"),{chatId:currentChatId,authorId:activeProfile.id,targetId:dmTarget.id,text,createdAt:Date.now(),read:false});i.value="";notify(dmTarget.id,"message",`${activeProfile.username} sent you a message`, "",currentChatId)}
window.insertChatEmoji=()=>{const i=document.getElementById("dm-input");i.value+="😊";i.focus()}
let typingTimer;window.setTyping=()=>{clearTimeout(typingTimer);if(!dmTarget)return;setDoc(dref("typing",currentChatId),{userId:activeProfile.id,username:activeProfile.username,typing:true,at:Date.now()},{merge:true});typingTimer=setTimeout(()=>setDoc(dref("typing",currentChatId),{userId:activeProfile.id,typing:false,at:Date.now()},{merge:true}),1200)}
window.showNotifications=()=>{modal(`<div class="flex items-center justify-between"><h2 class="text-xl font-extrabold">Notifications</h2><button class="text-xs text-indigo-600 font-bold" onclick="markNotifications()">Mark all read</button></div><div class="space-y-2 mt-4">${notifications.map(n=>`<button class="w-full text-left glass-soft rounded-2xl p-3 ${n.read?"opacity-60":""}" onclick="notificationClick('${n.id}','${n.postId||""}')"><div class="text-xs font-semibold">${esc(n.text)}</div><div class="text-[9px] text-gray-400 mt-1">${new Date(n.createdAt).toLocaleString()}</div></button>`).join("")||'<div class="text-center text-xs text-gray-400 py-8">You are all caught up.</div>'}</div>`)}
window.markNotifications=async()=>{await Promise.all(notifications.filter(n=>!n.read).map(n=>updateDoc(dref("notifications",n.id),{read:true})));toast("Notifications cleared");showNotifications()}
